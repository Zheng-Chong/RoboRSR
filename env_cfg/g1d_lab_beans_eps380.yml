# g1d_lab_beans_collect at the real G1D-PourBeansEps380 stand (robot g1d_lab_eps380); its layouts raise the desk to
# 0.83 m. Layouts and results stay in g1d_lab's namespace.
config_name: g1d_lab

config:
  sim: g1d_beans_collect_sim
  scene: default
  robot: g1d_lab_eps380
  camera: g1d_camera

observation:
  collect_freq: 30
  robot:
    joint_states: true
    world_ee_state: true
    ee_state: measured  # gripper state from the finger joints, not the last command (scripts/datagen/CONTRACT.md)
  vision:
    approximate_depth: false
    depth: false
    intrinsic_matrix: false
    extrinsic_matrix: false
    shape: true
