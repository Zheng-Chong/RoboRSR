robots:
  - {
    robot_type: arm,
    robot_name: g1d,
    coupled: True,
    need_planner: False,
    # The real G1D-PourBeansEps380 stand at this lab table, fitted to its head frames (table outline, 1.3 px rms):
    # 5.8 cm left of and 20.1 cm further from g1d_lab's stand, yaw -0.16 deg, lift column down (0, as recorded).
    # The layouts raise the desk instead of sinking the robot: to 0.83 m, the real hands' lowest grip points less the
    # gripper's depth (the head-frame fit alone says 0.865 m, where the sim hand drags on the desk).
    default_root_pos: [-0.0575, -0.931, 0.1115],
    default_root_rot: [0.70809, 0, 0, 0.70612],
    # arms reset to the mean eps380 first frame; remote_policy.py --init-joints sets each episode's own
    init_joint_pos: {
      LZ_mt_Joint: 0.0, LZ_it_Joint: 0.0,
      left_shoulder_pitch_joint: 0.413, left_shoulder_roll_joint: -0.001, left_shoulder_yaw_joint: -0.143,
      left_elbow_joint: -0.216, left_wrist_roll_joint: 0.033, left_wrist_pitch_joint: -0.407,
      left_wrist_yaw_joint: -0.025,
      right_shoulder_pitch_joint: 0.284, right_shoulder_roll_joint: -0.047, right_shoulder_yaw_joint: 0.017,
      right_elbow_joint: -0.090, right_wrist_roll_joint: 0.072, right_wrist_pitch_joint: -0.340,
      right_wrist_yaw_joint: 0.114
    }
  }
