robots:
  - {
    robot_type: arm,
    robot_name: g1d,
    coupled: True,
    need_planner: False,
    default_root_pos: [0.0, -0.73, 0.1115],
    default_root_rot: [0.707, 0, 0, 0.707],
    # g1d_lab's stand; arms at the mean first frame of the real G1D-PourBeansPlusEps222 teleop data (222 episodes,
    # per-joint std 0.01-0.15 rad): forearms forward, pads up behind the cups, instead of the default raised forearms.
    init_joint_pos: {
      LZ_mt_Joint: 0.0345, LZ_it_Joint: 0.0345,
      left_shoulder_pitch_joint: 0.194, left_shoulder_roll_joint: -0.046, left_shoulder_yaw_joint: -0.214,
      left_elbow_joint: -0.315, left_wrist_roll_joint: -0.029, left_wrist_pitch_joint: -0.249,
      left_wrist_yaw_joint: 0.119,
      right_shoulder_pitch_joint: 0.201, right_shoulder_roll_joint: 0.026, right_shoulder_yaw_joint: 0.158,
      right_elbow_joint: -0.308, right_wrist_roll_joint: 0.026, right_wrist_pitch_joint: -0.280,
      right_wrist_yaw_joint: 0.055
    }
  }
