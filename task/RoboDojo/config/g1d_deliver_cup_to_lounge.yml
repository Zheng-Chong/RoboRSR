# G1-D mobile manipulation (env config g1d_counter_mobile, real_scene2 with its lounge): carry the cup from the
# countertop to the lounge's round table. Eval layouts are generated by scripts/g1d/build_asset.py (LOUNGE_TASKS): the
# cup on the free countertop in front of the robot, 0.06-0.16 m to either side (grasped from the outside by the arm on
# that side), the lounge chairs (rigid, pushable) at their photo poses with a small jitter. The sections below
# describe that layout.
Rigid:
  -
    common:
      xlim: [-0.16, 0.16]  # |x| >= 0.06
      ylim: [-0.46, -0.38]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: plastic_cup
        index: [0]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["cup"]
  -
    common:
      xlim: [-0.05, 0.05]  # jitter about each chair's photo pose (build_params.json "lounge")
      ylim: [-0.05, 0.05]
      rotate_rand: True
      rotate_deg: 10
      relative_plane: "ground"

    category:
      -
        name: lounge_chair
        index: [0, 1]

    select_mode:
      nums: 6
      mode: "allow_duplicate"
      label: ["chair_0", "chair_1", "chair_2", "chair_3", "chair_4", "chair_5"]
