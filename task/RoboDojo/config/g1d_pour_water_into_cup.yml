# G1-D version of pour_liquid_into_cup: our fridge jug (pitcher) of red beans (granular "Fluid" particles, physics set
# in build_asset.py) instead of the bottle of liquor, y ranges shifted -0.20 m toward
# the robot (G1-D stands behind the table). Eval layouts come from scripts/g1d/build_asset.py; these ranges document the
# workspace. The eval layouts put the task in the reconstructed office scene (Room real_scene1: white lift table with
# its top at 0.68 m, robot-side edge at y=-0.60), replacing the stock table/ground/HDR dome; z follows that tabletop.
Rigid:
  -
    common:
      xlim: [[-0.30, -0.05], [0.05, 0.30]]
      ylim: [-0.40, -0.15]
      rotate_rand: False
      rotate_deg: 0
      relative_plane: "Table"
      qpos: [1, 0, 0, 0]
      margin: 0.04

    category:
      -
        name: "pitcher"
        index: [0, 1, 2]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["bottle"]  # reward label, the object is our fridge jug

  -
    common:
      xlim: [-0.05, 0.05]
      ylim: [-0.39, -0.29]  # build_asset.py POUR_CUP_PULL: 9 cm closer than the jug, within the cup arm's reach
      rotate_rand: False
      rotate_deg: 0
      relative_plane: "Table"
      qpos: [1, 0, 0, 0]
      margin: 0.04

    category:
      -
        name: "water_cup"  # our handleless enamel cup (scripts/objects/make_water_cup.py), grasped around its body
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["cup"]

Fluid:
  -
    common:
      xlim: [0.0, 0.0]
      ylim: [0.0, 0.0]
      zlim: [-0.0695, -0.0695]
      rotate_rand: False
      relative_plane: "bottle"
      check_mode: "enforce"

    category:
      -
        name: "wuliangye"
        index: [0]

    select_mode:
      nums: [1]
      mode: "unique"
      label: ["wine"]
