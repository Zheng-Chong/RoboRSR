<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real2Sim 数采管理平台</title>
<style>
:root {
  --bg: #F6F8FB; --surface: #FFFFFF; --surface-2: #F1F5F9; --surface-3: #E8EDF4;
  --border: #E2E8F0; --border-strong: #CBD5E1;
  --text: #0F172A; --text-2: #334155; --muted: #64748B; --faint: #94A3B8;
  --primary: #1E40AF; --primary-hover: #1E3A8A; --primary-soft: #EFF6FF; --primary-line: #BFDBFE; --ring: #2563EB;
  --accent: #D97706; --accent-text: #B45309; --accent-soft: #FEF3C7;
  --ok: #15803D; --ok-soft: #DCFCE7; --ok-bar: #22C55E;
  --bad: #B91C1C; --bad-soft: #FEE2E2; --bad-bar: #EF4444;
  --todo: #475569; --todo-soft: #F1F5F9; --todo-bar: #D5DCE6;
  --radius: 10px; --radius-sm: 6px;
  --shadow-1: 0 1px 2px rgba(15, 23, 42, .05);
  --shadow-2: 0 6px 16px rgba(15, 23, 42, .08);
  --shadow-3: 0 18px 48px rgba(15, 23, 42, .22);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --side: 236px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font: 14px/1.55 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
h1, h2, h3 { letter-spacing: -.01em; }
.mono, code { font-family: var(--mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.txt-bad { color: var(--bad); }
.txt-ok { color: var(--ok); }
.sp { flex: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.ic-sm { width: 13px; height: 13px; }
.ic-lg { width: 18px; height: 18px; }

/* layout */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; z-index: 5; display: flex; flex-direction: column; gap: 18px; height: 100vh; padding: 18px 14px; background: var(--surface); border-right: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; background: var(--primary); color: #fff; font: 700 12px/1 var(--mono); letter-spacing: .03em; }
.brand b { display: block; font-size: 15px; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12px; }
nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border-radius: 8px; color: var(--text-2); font-weight: 500; transition: background .15s, color .15s; }
.nav-item:hover { background: var(--surface-2); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
.nav-item .count { margin-left: auto; color: var(--faint); font: 500 12px var(--mono); }
.nav-item .badge { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font: 600 12px/20px var(--mono); text-align: center; }
.side-foot { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }
.field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
.me { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { display: grid; flex: none; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 650; }
.me-name { min-width: 0; overflow: hidden; line-height: 1.3; }
.me-name b { display: block; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.me-name small { color: var(--muted); font: 11px var(--mono); }
.login { display: grid; min-height: 100vh; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #E0E7FF 0, transparent 40%), var(--bg); }
.login-card { display: flex; flex-direction: column; gap: 14px; width: min(400px, 100%); padding: 28px; box-shadow: var(--shadow-2); }
.login-card h1 { margin: 6px 0 0; font-size: 20px; }
.login-card p { margin: 0; }
.login-card .field { color: var(--text-2); font-size: 13px; font-weight: 500; }
.login-card input:not([type=checkbox]) { width: 100%; min-height: 40px; }
.pw { position: relative; }
.pw input { padding-right: 42px !important; }
.pw .btn { position: absolute; top: 3px; right: 3px; min-height: 34px; border: 0; background: transparent; }
.field-error { margin: 0; color: var(--bad); font-size: 12px; }
.source { color: var(--muted); font-size: 12px; line-height: 1.6; }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; }
.dot.ok { background: var(--ok-bar); }
.dot.warn { background: var(--accent); }
main { min-width: 0; padding: 26px 30px 56px; }
.page { max-width: 1480px; margin: 0 auto; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.ph h1 { margin: 0; font-size: 22px; font-weight: 650; }
.ph p { max-width: 820px; margin: 4px 0 0; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.filters { margin-bottom: 14px; }
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; height: auto; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--border); }
  nav { flex: 1 1 100%; flex-direction: row; order: 3; overflow-x: auto; }
  .nav-item { flex: none; }
  .side-foot { flex-direction: row; align-items: center; margin: 0 0 0 auto; padding: 0; border: 0; }
  .source, .me-name { display: none; }
  main { padding: 18px 14px 40px; }
}

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.card-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.card-b { padding: 12px 16px 16px; }
.section-title { display: flex; align-items: center; gap: 8px; margin: 30px 0 12px; font-size: 15px; font-weight: 600; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fill, minmax(206px, 1fr)); }
.kpi { display: block; padding: 14px 16px 16px; color: inherit; transition: border-color .15s, box-shadow .15s; }
.kpi:hover { border-color: var(--primary-line); box-shadow: var(--shadow-2); text-decoration: none; }
.k-label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
.k-value { margin: 8px 0 2px; font: 600 28px/1.1 var(--mono); letter-spacing: -.02em; }
.k-meta { color: var(--muted); font-size: 12px; }
.pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.trio { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1280px) { .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .trio { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .pipeline { grid-template-columns: 1fr; } }
.step { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); font: 700 11px var(--mono); }
.meter { display: grid; grid-template-columns: minmax(96px, 1fr) minmax(60px, 1.2fr) auto; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.meter .lbl { color: var(--text-2); }
.meter .val { min-width: 64px; color: var(--muted); font: 12px var(--mono); text-align: right; }
.callout { display: flex; gap: 10px; margin-bottom: 14px; padding: 10px 12px; border: 1px solid #FDE68A; border-radius: 8px; background: #FFFBEB; color: #92400E; font-size: 13px; }
.callout.bad { border-color: #FECACA; background: #FEF2F2; color: #991B1B; }
.callout.ok { border-color: #BBF7D0; background: #F0FDF4; color: #166534; }
.users { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
@media (max-width: 1000px) { .users { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack .field { color: var(--text-2); font-size: 13px; font-weight: 500; }
.stack input:not([type=checkbox]) { width: 100%; }
.pw-row { display: flex; gap: 6px; }
.pw-row input { flex: 1; min-width: 0; }
.callout .ic { margin-top: 2px; }
.empty { display: grid; place-items: center; gap: 6px; padding: 40px 16px; color: var(--muted); text-align: center; }
.empty .ic { width: 28px; height: 28px; color: var(--faint); }
.empty b { color: var(--text-2); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--text-2); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { border-color: var(--primary); background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ok { border-color: var(--ok); background: var(--ok); color: #fff; }
.btn-ok:hover { background: #166534; }
.btn-bad { border-color: var(--bad); background: var(--bad); color: #fff; }
.btn-bad:hover { background: #991B1B; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-icon { width: 34px; padding: 0; }
.btn-block { width: 100%; }
.btn-lg { min-height: 44px; }
kbd { padding: 0 5px; border: 1px solid currentColor; border-radius: 4px; font: 500 11px/16px var(--mono); opacity: .75; }
input:not([type=checkbox]):not([type=file]), select, textarea { min-height: 34px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); transition: border-color .15s; }
input:not([type=checkbox]):not([type=file]):hover, select:hover, textarea:hover { border-color: var(--faint); }
input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); cursor: pointer; }
textarea { width: 100%; min-height: 72px; resize: vertical; }
select { cursor: pointer; }
.search { position: relative; }
.search .ic { position: absolute; top: 9px; left: 10px; color: var(--muted); pointer-events: none; }
.search input { width: 230px; padding-left: 32px !important; }
.check { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; color: var(--text-2); cursor: pointer; }
.segctl { display: inline-flex; padding: 2px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-2); }
.segctl button { min-height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); font-weight: 500; cursor: pointer; }
.segctl button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-1); }

/* status */
.st { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border: 1px solid transparent; border-radius: 999px; background: var(--todo-soft); color: var(--todo); font-size: 12px; font-weight: 500; white-space: nowrap; }
.st .ic { width: 12px; height: 12px; }
.st.ok { background: var(--ok-soft); color: var(--ok); }
.st.bad { background: var(--bad-soft); color: var(--bad); }
.st.warn { background: var(--accent-soft); color: var(--accent-text); }
.st.na { background: transparent; border: 1px dashed var(--border-strong); color: var(--faint); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); font: 500 12px var(--mono); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.togglechip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--text-2); font-size: 12px; cursor: pointer; }
.togglechip[aria-pressed="true"] { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.togglechip.pri[aria-pressed="true"] { border-color: var(--primary-line); background: var(--primary-soft); color: var(--primary); }
.togglechip:disabled { cursor: default; opacity: .75; }
.rows { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.rowline { display: flex; align-items: center; gap: 6px; }
.rowline input { min-width: 0; }
.seg { display: flex; flex: 1; gap: 2px; min-width: 60px; }
.seg i { flex: 1; height: 6px; border-radius: 2px; background: var(--todo-bar); }
.seg i.ok { background: var(--ok-bar); }
.seg i.bad { background: var(--bad-bar); }
.seg i.na { background: repeating-linear-gradient(45deg, #E2E8F0 0 2px, #F8FAFC 2px 4px); }
.progress-row { display: flex; align-items: center; gap: 10px; }
.bar { display: flex; height: 8px; overflow: hidden; border-radius: 999px; background: var(--surface-3); }
.bar i { display: block; height: 100%; }
.bar .ok { background: var(--ok-bar); }
.bar .bad { background: var(--bad-bar); }
.bar .pri { background: var(--primary); }

/* tables */
.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-1); }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
th { position: sticky; top: 0; z-index: 1; background: #F8FAFC; color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr[data-open] { cursor: pointer; }
tr[data-open]:hover td { background: #F8FAFC; }
tr.sel td, tr.sel:hover td { background: var(--primary-soft); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.t-main { font-weight: 600; }
.t-sub { color: var(--muted); font-size: 12px; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-all; }
table.plain { font-size: 13px; }
table.plain th, table.plain td { position: static; padding: 7px 8px; background: none; }

/* media */
.scene-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.cards { grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); }
.mcard { overflow: hidden; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.mcard:hover { border-color: var(--primary-line); box-shadow: var(--shadow-2); }
.media { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--surface-2); color: var(--faint); }
.media.r169 { aspect-ratio: 16 / 9; }
.media.r43 { aspect-ratio: 4 / 3; }
.media > img { display: block; width: 100%; height: 100%; object-fit: cover; }
.media .inset { position: absolute; right: 8px; bottom: 8px; width: 34%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border: 2px solid #fff; border-radius: 6px; box-shadow: var(--shadow-2); }
.media .pills { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; background: rgba(15, 23, 42, .72); color: #fff; font: 500 11px var(--mono); }
.mcard-b { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 12px; }
.mcard-t { display: flex; align-items: baseline; gap: 8px; }
.mcard-t b { overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
.thumb { display: grid; place-items: center; width: 56px; height: 42px; overflow: hidden; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--faint); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 8px; }
.gthumb { position: relative; display: block; aspect-ratio: 4 / 3; padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); cursor: zoom-in; }
.gthumb img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .2s; }
.gthumb:hover img { transform: scale(1.03); }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .compare { grid-template-columns: 1fr; } }
.compare figure { margin: 0; min-width: 0; }
.compare figcaption { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
.hero { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--muted); cursor: zoom-in; }
.hero img { display: block; width: 100%; height: 100%; object-fit: cover; }
.hero.empty-hero { gap: 6px; padding: 16px; cursor: default; font-size: 12px; text-align: center; }
.strip { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
.strip .item { position: relative; flex: none; }
.strip .gthumb { width: 64px; }
.del { position: absolute; top: 3px; right: 3px; display: grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: rgba(15, 23, 42, .75); color: #fff; cursor: pointer; opacity: 0; transition: opacity .15s; }
.item:hover .del, .del:focus-visible { opacity: 1; }
.upload { position: relative; overflow: hidden; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }

/* drawer */
#scrim { position: fixed; inset: 0; z-index: 20; background: rgba(15, 23, 42, .38); opacity: 0; pointer-events: none; transition: opacity .2s; }
#scrim.on { opacity: 1; pointer-events: auto; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; display: flex; flex-direction: column; width: min(780px, 100vw); background: var(--surface); box-shadow: var(--shadow-3); transform: translateX(100%); visibility: hidden; transition: transform .22s ease, visibility 0s .22s; }
#drawer.on { transform: none; visibility: visible; transition: transform .22s ease; }
.dr-h { display: flex; align-items: flex-start; gap: 12px; padding: 18px 22px 14px; border-bottom: 1px solid var(--border); }
.dr-h h2 { margin: 0; font-size: 18px; font-weight: 650; word-break: break-all; }
.dr-h p { margin: 3px 0 0; color: var(--muted); font-size: 12px; word-break: break-all; }
.dr-b { flex: 1; overflow: auto; padding: 4px 22px 48px; }
.sec { margin-top: 22px; }
.sec > h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; color: var(--text-2); font-size: 13px; font-weight: 650; }
.sec > h3 .muted { font-weight: 400; }
.stage-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; border: 1px solid var(--border); border-radius: 8px; }
.stage-list li { display: grid; grid-template-columns: 84px minmax(110px, 180px) minmax(0, 1fr); align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.stage-list li:last-child { border-bottom: 0; }
.stage-list .sl-detail { color: var(--muted); font-size: 12px; }
.form { display: grid; grid-template-columns: 130px minmax(0, 1fr); align-items: center; gap: 10px 14px; }
.form > label { color: var(--text-2); font-size: 13px; }
.form .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.form .ctl > input:not([type=checkbox]), .form .ctl > select { flex: 1 1 200px; max-width: 360px; }
.form .ctl.dims input { flex: 0 0 96px; width: 96px; min-width: 0; }
.hint { color: var(--muted); font-size: 12px; }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } .stage-list li { grid-template-columns: 84px 1fr; } .stage-list .sl-detail { grid-column: 1 / -1; } }
.code { position: relative; }
.code pre { margin: 0; padding: 12px 46px 12px 14px; overflow: auto; border-radius: 8px; background: #0F172A; color: #E2E8F0; font: 12px/1.65 var(--mono); white-space: pre-wrap; word-break: break-all; }
.code .copy { position: absolute; top: 6px; right: 6px; border-color: rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .06); color: #CBD5E1; }
.code .copy:hover { background: rgba(255, 255, 255, .14); }

/* QA */
.qa { display: grid; grid-template-columns: minmax(420px, 5fr) minmax(480px, 6fr); align-items: start; gap: 16px; }
.qa-list { max-height: calc(100vh - 210px); }
.qa-panel { position: sticky; top: 20px; }
@media (max-width: 1200px) { .qa { grid-template-columns: 1fr; } .qa-panel { position: static; } .qa-list { max-height: 460px; } }
.bulkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px 8px 0 0; background: var(--primary); color: #fff; font-size: 13px; }
.bulkbar .btn { min-height: 30px; border-color: rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .08); color: #fff; }
.bulkbar .btn:hover { background: rgba(255, 255, 255, .18); }
.videos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.videos figure { position: relative; margin: 0; }
.videos video { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; background: #000; }
.videos figcaption { position: absolute; top: 8px; left: 8px; padding: 1px 6px; border-radius: 4px; background: rgba(15, 23, 42, .72); color: #fff; font: 500 11px var(--mono); pointer-events: none; }
.decision { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

/* overlays */
#lightbox { position: fixed; inset: 0; z-index: 30; display: none; grid-template-rows: auto minmax(0, 1fr); background: rgba(2, 6, 23, .9); }
#lightbox.on { display: grid; }
.lb-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #E2E8F0; font-size: 13px; }
.lb-top .btn { border-color: rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .06); color: #E2E8F0; }
.lb-stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 0 64px 24px; }
.lb-stage img { max-width: 100%; max-height: calc(100vh - 90px); border-radius: 6px; object-fit: contain; }
.lb-nav { position: absolute; top: 50%; width: 44px; height: 44px; border-color: rgba(255, 255, 255, .2); border-radius: 50%; background: rgba(255, 255, 255, .08); color: #fff; transform: translateY(-50%); }
.lb-nav:hover { background: rgba(255, 255, 255, .18); }
.lb-prev { left: 12px; }
.lb-next { right: 12px; }
#toast { position: fixed; bottom: 24px; left: 50%; z-index: 40; display: flex; align-items: center; gap: 8px; max-width: min(560px, 92vw); padding: 10px 14px; border-radius: 10px; background: #0F172A; color: #fff; box-shadow: var(--shadow-3); font-size: 13px; opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: opacity .2s, transform .2s; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: #7F1D1D; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const file = (p) => `/file?path=${encodeURIComponent(p)}`;
const num = (v) => v !== null && v !== undefined && v !== '' && !Number.isNaN(Number(v));
const pct = (x) => (num(x) ? `${Math.round(x * 100)}%` : '—');
const sum = (xs) => xs.reduce((a, b) => a + b, 0);
const fmtTime = (t) => (t ? new Date(t * 1000).toLocaleString('zh-CN', {hour12: false}) : '');
const live = (xs) => xs.filter((d) => !d.auto?.missing);
const group = (xs, key) => xs.reduce((m, x) => ((m[key(x)] ||= []).push(x), m), {});
const rel = (p) => (p && INFO.root && p.startsWith(`${INFO.root}/`) ? p.slice(INFO.root.length + 1) : p);
const base = (p) => String(p).split('/').pop();
const opts = (options, value) => Object.entries(options).map(([k, l]) => `<option value="${esc(k)}" ${k === String(value ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

const KINDS = ['scene', 'object', 'task', 'episode'];
const TAB_OF = {scene: 'scenes', object: 'objects', task: 'tasks', episode: 'qa'};
const KIND_LABEL = {scene: '场景', object: '物体', task: '任务', episode: '回合'};
const S = {scene: [], object: [], task: [], episode: []};
const UI = {
  tab: 'overview', drawer: null, ep: null, taskDim: 'custom', taskQ: '', sel: new Set(), loaded: false, syncing: false, syncedAt: '',
  obj: {q: '', role: '', src: '', photo: false, view: localStorage.objView || 'cards'},
  qa: {task: '', config: '', policy: '', result: '', status: 'pending'},
};
let INFO = {};
let ME = null;
let USERS = [];
let IDX = {};  // indices in use per <type>/<category>, for registering objects
let EP_BY_TASK = {};
const GAL = {};

// ---------- stages: [key, label, doc -> {s: ok | bad | todo | na, t: detail}] ----------
const ok = (t = '') => ({s: 'ok', t});
const bad = (t = '') => ({s: 'bad', t});
const todo = (t = '') => ({s: 'todo', t});
const na = (t = '') => ({s: 'na', t});
const flag = (v, hint) => (v ? ok('已完成') : todo(hint));
const STATE = {ok: '通过', bad: '不通过', todo: '待办', na: '不适用'};
const STATE_IC = {ok: 'check', bad: 'x', todo: 'circle', na: 'minus'};
const evalStages = (stages, d) => stages.map(([k, label, fn]) => ({k, label, ...fn(d)}));
const allOk = (stages, d) => evalStages(stages, d).every((r) => r.s === 'ok' || r.s === 'na');

const SCENE_STAGES = [
  ['photos', '照片采集', (d) => (d.auto.photos?.length ? ok(`${d.auto.photos.length} 张参考照片`) : todo('reference/ 下没有照片'))],
  ['fit', '相机拟合', (d) => (!d.auto.fit_views ? todo('没有 fit_photo.json 或 cameras_scene.json')
    : ok(d.auto.fit_max_px == null ? `${d.auto.fit_views} 个 SfM 相机` : `${d.auto.fit_views} 个视角，最大残差 ${d.auto.fit_max_px} px`))],
  ['build', 'USD 构建', (d) => (d.auto.built ? ok(d.auto.rooms.join('、')) : todo('缺 usd/scene.usda 或 Room 入口'))],
  ['check', '离线检查', (d) => (!d.auto.checks_total ? todo('没有 check_report.json')
    : d.auto.checks_failed.length ? bad(`${d.auto.checks_failed.length}/${d.auto.checks_total} 项未通过`) : ok(`${d.auto.checks_total} 项全部通过`))],
  ['measure', '尺寸实测 < 1 cm', (d) => {
    if (!num(d.measured_top_z)) return todo('卷尺实测桌高、桌沿相对机器人的位置');
    const dz = Math.abs(d.measured_top_z - d.auto.top_z) * 100;
    const edge = num(d.edge_err_cm) ? Math.abs(d.edge_err_cm) : null;
    const text = `桌高差 ${dz.toFixed(1)} cm，${edge == null ? '桌沿未实测' : `桌沿差 ${edge} cm`}`;
    if (dz >= 1 || edge >= 1) return bad(text);
    return edge == null ? todo(text) : ok(text);
  }],
  ['overlay', '叠图 < 5 px（≥ 3 视角）', (d) => {
    if (!num(d.overlay_px)) return todo('用标定好的头部相机把仿真渲染和真机照片叠图');
    const text = `最大偏差 ${d.overlay_px} px，${d.overlay_views || 0} 个视角`;
    return d.overlay_px < 5 && d.overlay_views >= 3 ? ok(text) : bad(text);
  }],
  ['lighting', '灯光建模', (d) => flag(d.lighting, '按现场记录建模灯的类型、位置和大致亮度')],
  ['isaac', 'Isaac 渲染验证', (d) => flag(d.isaac, 'RTX 渲染，与真机头部相机画面对比')],
  ['shared', '入共享资产库', (d) => flag(d.shared, 'build_asset.py 装入 Assets/Room/ 并生成布局')],
];

const MATERIALS = ['PP 塑料', 'PET 塑料', 'PS 塑料', '玻璃', '陶瓷', '不锈钢', '铝', '木', '纸', '硅胶', '布'];

function simReal(eps) {
  const pairs = eps.filter((e) => e.real === 'success' || e.real === 'fail');
  if (!pairs.length) return null;
  let a = 0, b = 0, c = 0, d = 0;
  for (const e of pairs) {
    const sim = e.auto.success, real = e.real === 'success';
    if (sim && real) a++; else if (sim) b++; else if (real) c++; else d++;
  }
  const n = pairs.length, A = (a + d) / n, pe = ((a + b) * (a + c) + (c + d) * (b + d)) / (n * n);
  return {n, a, b, c, d, A, kappa: pe < 1 ? (A - pe) / (1 - pe) : null, trust: a + b ? a / (a + b) : null};
}

function randomPassword() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  return Array.from(crypto.getRandomValues(new Uint32Array(12)), (x) => abc[x % abc.length]).join('');
}

// ---------- actions ----------
async function api(url, options = {}) {
  const r = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...options});
  if (r.status === 401 && ME && url !== '/api/password') { showLogin('登录已过期，请重新登录'); throw new Error('请先登录'); }
  if (!r.ok) throw new Error((await r.json().catch(() => null))?.error || `${r.status} ${r.statusText}`);
  return r.json();
}
function showLogin(message = '') {
  ME = null;
  UI.drawer = null;
  renderDrawer();
  closeLB();
  $('#main').innerHTML = '';
  document.querySelector('.app').hidden = true;
  $('#login').hidden = false;
  $('#lg-err').textContent = message;
  $('#lg-user').setAttribute('aria-invalid', String(Boolean(message)));
  ($('#lg-user').value ? $('#lg-pass') : $('#lg-user')).focus();
}
async function doLogin() {
  const btn = $('#lg-btn'), username = $('#lg-user').value.trim(), password = $('#lg-pass').value;
  if (!username || !password) { $('#lg-err').textContent = '请输入用户名和密码'; return; }
  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    ME = await api('/api/login', {method: 'POST', body: JSON.stringify({username, password})});
    $('#lg-pass').value = '';
    $('#lg-err').textContent = '';
    await enter();
  } catch (err) {
    $('#lg-err').textContent = err.message;
    $('#lg-pass').select();
  }
  btn.disabled = false;
  btn.textContent = '登录';
}
async function logout() {
  await fetch('/api/logout', {method: 'POST'}).catch(() => null);
  KINDS.forEach((k) => { S[k] = []; });
  USERS = [];
  UI.loaded = false;
  UI.cred = UI.nu = null;
  showLogin();
}
async function enter() {
  $('#login').hidden = true;
  document.querySelector('.app').hidden = false;
  INFO = await api('/api/info');
  USERS = ME.admin ? await api('/api/users') : [];
  renderNav();
  await load();
}
function togglePw(btn) {
  const input = btn.previousElementSibling, show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.setAttribute('aria-pressed', String(show));
  btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
  btn.innerHTML = ic(show ? 'eye-off' : 'eye');
}
async function changePassword() {
  const old = $('#pw-old').value, next = $('#pw-new').value, again = $('#pw-again').value, err = $('#pw-err');
  err.textContent = next.length < 8 ? '新密码至少 8 位' : next !== again ? '两次输入的新密码不一致' : '';
  if (err.textContent) return;
  try {
    await api('/api/password', {method: 'POST', body: JSON.stringify({old, new: next})});
    closeDrawer();
    toast('密码已修改，其他设备上的登录已退出');
  } catch (e) { err.textContent = e.message; }
}
function drawerAccount() {

    <input id="${id}" type="password" autocomplete="${auto}" aria-describedby="pw-err" style="width:100%">

const userApi = (username, options) => api(`/api/users?username=${encodeURIComponent(username)}`, options);
async function createUser() {

async function editUser(username, patch) {

  } catch (err) { toast(`保存失败：${err.message}`, true); }

}
async function resetPassword(username) {
  if (!confirm(`为 ${username} 生成新密码？这个账号已登录的设备都会退出。`)) return;
  const password = randomPassword();
  try {
    USERS = await userApi(username, {method: 'PUT', body: JSON.stringify({password})});
    UI.cred = {text: `${username} 的密码已重置`, username, password};
    render();
  } catch (err) { toast(`重置失败：${err.message}`, true); }

async function deleteUser(username) {
  if (!confirm(`删除账号 ${username}？已有记录上的署名保留。`)) return;
  try {
    USERS = await userApi(username, {method: 'DELETE'});

  } catch (err) { toast(`删除失败：${err.message}`, true); }

async function load() {
  await Promise.all(KINDS.map(async (k) => { S[k] = await api(`/api/items?kind=${k}`); }));
  UI.loaded = true;
  UI.syncedAt = new Date().toLocaleTimeString('zh-CN', {hour12: false});
  render();
}
async function sync(quiet = false) {
  UI.syncing = true;
  renderNav();
  try {
    const n = await api('/api/scan', {method: 'POST'});
    await load();
    if (!quiet) toast(`同步完成：场景 ${n.scene} · 物体 ${n.object} · 任务 ${n.task} · 回合 ${n.episode}`);
  } catch (err) { toast(`同步失败：${err.message}`, true); }
  UI.syncing = false;
  renderNav();
}
async function save(kind, id, patch, quiet = false) {
  try {
    const doc = await api(`/api/items?kind=${kind}&id=${encodeURIComponent(id)}`, {method: 'PUT', body: JSON.stringify(patch)});
    const i = S[kind].findIndex((x) => x.id === id);
    if (i >= 0) S[kind][i] = doc; else S[kind].push(doc);
    if (!quiet) render();
    return true;
  } catch (err) { toast(`保存失败：${err.message}`, true); return false; }
}
async function removeDoc(kind, id) {
  if (!confirm(`删除 ${id} 的登记和录入内容？`)) return;
  await api(`/api/items?kind=${kind}&id=${encodeURIComponent(id)}`, {method: 'DELETE'});
  S[kind] = S[kind].filter((x) => x.id !== id);
  closeDrawer();
  toast('已删除');
}
async function openNewObject(btn) {
  try { IDX = await api('/api/object-indices'); } catch (err) { return toast(`读取编号失败：${err.message}`, true); }
  openDrawer('new-object', 'new', btn);
  suggestIndex();
}
function suggestIndex(fromCategory = true) {
  const type = $('#no-type').value, cat = $('#no-cat').value.trim(), taken = IDX[`${type}/${cat}`] || [];
  $('#dl-cats').innerHTML = Object.keys(IDX).filter((g) => g.startsWith(`${type}/`)).map((g) => `<option value="${esc(g.split('/')[1])}">`).join('');
  if (fromCategory) $('#no-idx').value = taken.length ? Math.max(...taken) + 1 : 0;
  const idx = Number($('#no-idx').value);
  $('#no-id').textContent = cat ? `${type}/${cat}/${String(idx).padStart(5, '0')}${taken.includes(idx) ? ' · 已被占用' : ''}` : '';
}
function previewPhotos(input) {
  $('#no-previews').innerHTML = [...input.files].map((f) => `<div class="item"><span class="gthumb"><img src="${URL.createObjectURL(f)}" alt="${esc(f.name)}"></span></div>`).join('');
}
async function createObject(btn) {
  const type = $('#no-type').value, cat = $('#no-cat').value.trim(), idx = $('#no-idx').value.trim(), err = $('#no-err');
  const taken = IDX[`${type}/${cat}`] || [], next = taken.length ? Math.max(...taken) + 1 : 0;
  err.textContent = !/^\w[\w-]*$/.test(cat) ? '类别只能含字母、数字、下划线和连字符，如 measuring_cup'
    : !/^\d+$/.test(idx) ? '编号为非负整数' : taken.includes(Number(idx)) ? `这个编号已被资产库或已登记的物体占用，下一个空闲编号是 ${next}` : '';
  if (err.textContent) return;
  const id = `${type}/${cat}/${idx.padStart(5, '0')}`, value = (sel) => $(sel).value.trim(), files = [...$('#no-photos').files];
  const doc = {
    twin: true, name: value('#no-name'), tasks: pickedTasks($('#no-tasks')), role: value('#no-role'), material: value('#no-material'), color: value('#no-color'),
    real_mass: $('#no-mass').value === '' ? null : Number($('#no-mass').value), dims: readRows($('#no-dims')), features: value('#no-features'), requirements: value('#no-req'),
  };
  btn.disabled = true;
  try {
    await api(`/api/items?kind=object&id=${encodeURIComponent(id)}`, {method: 'PUT', body: JSON.stringify(doc)});
    const n = files.length ? await uploadFiles(id, files) : 0;
    await sync(true);
    openDrawer('object', id);
    toast(`已登记 ${id}${n ? `，上传 ${n} 张照片` : ''}；建模任务在抽屉顶部`);
  } catch (e) {
    err.textContent = `登记失败：${e.message}`;
    btn.disabled = false;
  }
}
async function uploadFiles(id, files) {
  let n = 0;
  for (const f of files) {
    if (f.size > 25 * 1024 * 1024) { toast(`${f.name} 超过 25 MB，已跳过`, true); continue; }
    const r = await fetch(`/api/photo?id=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});
    if (!r.ok) throw new Error(`${f.name}：${r.status}`);
    n++;
  }
  return n;
}
async function uploadPhotos(input) {
  const files = [...input.files];
  if (!files.length) return;
  toast(`正在上传 ${files.length} 张照片…`);
  try {
    const n = await uploadFiles(input.dataset.id, files);
    await sync(true);
    toast(`已上传 ${n} 张照片`);
  } catch (err) { toast(`上传失败：${err.message}`, true); }
}
function readRows(box) {
  return [...box.querySelectorAll('.rowline')].map((line) => Object.fromEntries([...line.querySelectorAll('input')].map((el) =>
    [el.dataset.k, el.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value.trim()])))
    .filter((r) => Object.values(r).some((v) => v !== null && v !== ''));
}
function saveRows(el) {
  const box = el.closest('.rows'), rec = box.closest('[data-kind]');
  if (rec) save(rec.dataset.kind, rec.dataset.id, {[box.dataset.f]: readRows(box)});
}
function addRows(id, names) {
  const box = $(`#${id}`), cols = JSON.parse(box.dataset.cols), have = new Set(readRows(box).map((r) => r[cols[0][0]]));
  const add = names.filter((x) => !x || !have.has(x)), n0 = box.children.length;
  box.insertAdjacentHTML('beforeend', add.map((x, j) => rowLine(id, cols, {[cols[0][0]]: x}, n0 + j)).join(''));
  [...box.querySelectorAll('input')].find((el) => el.value === '')?.focus();
  if (add.some(Boolean)) saveRows(box);
}
function removeRow(btn) {
  const box = btn.closest('.rows');
  btn.closest('.rowline').remove();
  saveRows(box);
}
function toggleTask(btn) {
  btn.setAttribute('aria-pressed', String(btn.getAttribute('aria-pressed') !== 'true'));
  const rec = btn.closest('[data-kind]');
  if (rec) save(rec.dataset.kind, rec.dataset.id, {tasks: pickedTasks(btn.parentElement)});
}
async function deletePhoto(path) {
  if (!confirm(`删除照片 ${base(path)}？`)) return;
  try {
    await api(`/api/photo?path=${encodeURIComponent(path)}`, {method: 'DELETE'});
    await sync(true);
    toast('照片已删除');
  } catch (err) { toast(`删除失败：${err.message}`, true); }
}
function onFieldChange(ev) {
  const el = ev.target;
  if (el.closest('.rows')) { saveRows(el); return; }
  if (el.dataset.sel !== undefined) { if (el.checked) UI.sel.add(el.dataset.sel); else UI.sel.delete(el.dataset.sel); render(); return; }
  const f = el.dataset.f, box = el.closest('[data-kind]');
  if (!f || !box) return;
  const {kind, id} = box.dataset, doc = S[kind].find((x) => x.id === id) || {};
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type === 'number') v = el.value === '' ? null : Number(el.value);
  const [k, sub] = f.split('.');
  let patch = {[k]: v};
  if (/^\d+$/.test(sub || '')) { const arr = [...(doc[k] || [])]; arr[Number(sub)] = v; patch = {[k]: arr}; }
  else if (sub) patch = {[k]: {...(doc[k] || {}), [sub]: v}};
  save(kind, id, patch);
}
async function setQA(status) {
  const list = qaList(), i = list.findIndex((e) => e.id === UI.ep);
  await save('episode', UI.ep, {qa: status});
  if (status === 'pass' && list[i + 1]) pick(list[i + 1].id);
}
const setReal = (v) => save('episode', UI.ep, {real: v});
function toggleTag(i) {
  const e = S.episode.find((x) => x.id === UI.ep), tags = new Set(e.tags || []);
  if (tags.has(TAGS[i])) tags.delete(TAGS[i]); else tags.add(TAGS[i]);
  save('episode', e.id, {tags: [...tags]});
}
function toggleAll(checked) {
  qaList().forEach((e) => (checked ? UI.sel.add(e.id) : UI.sel.delete(e.id)));
  render();
}
async function bulkQA(status) {
  const ids = [...UI.sel];
  if (!ids.length || !confirm(`将 ${ids.length} 个回合设为「${QA_STATES[status]}」？`)) return;
  let n = 0;
  for (const id of ids) n += await save('episode', id, {qa: status}, true) ? 1 : 0;
  UI.sel.clear();
  render();
  toast(`已将 ${n} 个回合设为「${QA_STATES[status]}」`);
}
function pick(id) {
  if (!id) return;
  UI.ep = id;
  render();
  $('.qa-list tr.sel')?.scrollIntoView({block: 'nearest'});
}
function videos(action, value) {
  document.querySelectorAll('#qa-videos video').forEach((v) => {
    if (action === 'play') v.play();
    else if (action === 'pause') v.pause();
    else if (action === 'restart') { v.currentTime = 0; v.play(); }
    else if (action === 'rate') v.playbackRate = Number(value);
  });
}
function qaFilter(ds) {
  UI.qa = {task: ds.t, config: ds.c, policy: ds.p, result: '', status: ''};
  UI.tab = 'qa';
  UI.drawer = null;
  history.replaceState(null, '', '#qa');
  UI.ep = qaList()[0]?.id || null;
  render();
}
function go(kind, id) {
  UI.tab = TAB_OF[kind];
  history.replaceState(null, '', `#${UI.tab}`);
  if (kind === 'episode') {
    UI.drawer = null;
    UI.qa = {task: '', config: '', policy: '', result: '', status: ''};
    UI.ep = id;
    render();
  } else openDrawer(kind, id);
}
function setObjView(view) { UI.obj.view = localStorage.objView = view; render(); }
function exportPassed() {
  const f = UI.qa;
  const rows = live(S.episode).filter((e) => e.qa === 'pass' && (!f.task || e.auto.task === f.task)
    && (!f.config || e.auto.config === f.config) && (!f.policy || e.auto.policy === f.policy))
    .map((e) => ({id: e.id, task: e.auto.task, config: e.auto.config, policy: e.auto.policy, seed: e.auto.seed, layout_id: e.auto.layout_id,
      success: e.auto.success, score: e.auto.score, run: e.auto.run, videos: e.auto.videos, tags: e.tags || [], note: e.note || '',
      real: e.real || '', reviewer: e._by || '', reviewed_at: e._at}));
  if (!rows.length) return toast('当前任务 / 配置 / 策略筛选下没有质检通过的回合', true);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(rows, null, 2)], {type: 'application/json'}));
  a.download = `qa_pass_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  toast(`已导出 ${rows.length} 个回合`);
}
async function copyCode(btn) {
  const text = btn.previousElementSibling.textContent;
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const ta = Object.assign(document.createElement('textarea'), {value: text});
      document.body.append(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制');
  } catch { toast('复制失败，请手动选中复制', true); }
}
function toast(msg, error = false) {
  const t = $('#toast');
  t.innerHTML = `${ic(error ? 'alert' : 'check')}<span>${esc(msg)}</span>`;
  t.className = `on${error ? ' err' : ''}`;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.className = ''; }, error ? 5000 : 3000);
}

// ---------- overlays ----------
const LB = {list: [], i: 0, ret: null};
function lightbox(list, i) {
  if (!list?.length) return;
  LB.list = list; LB.i = i; LB.ret = document.activeElement;
  renderLB();
  $('#lightbox').classList.add('on');
  $('#lb-close').focus();
}
function renderLB() {
  const p = LB.list[LB.i];
  $('#lb-img').src = file(p);
  $('#lb-img').alt = base(p);
  $('#lb-cap').textContent = `${base(p)} · ${LB.i + 1} / ${LB.list.length}`;
  $('#lb-open').href = file(p);
  document.querySelectorAll('.lb-nav').forEach((b) => { b.hidden = LB.list.length < 2; });
}
function lbStep(d) { LB.i = (LB.i + d + LB.list.length) % LB.list.length; renderLB(); }
function closeLB() { $('#lightbox').classList.remove('on'); LB.ret?.focus?.(); }
function openDrawer(kind, id, trigger) {
  const wasOpen = Boolean(UI.drawer);
  UI.drawer = {kind, id};
  if (!wasOpen) UI.drawerRet = trigger || document.activeElement;
  UI.drawerFocus = true;
  render();
}
function closeDrawer() {
  if (!UI.drawer) return;
  UI.drawer = null;
  render();
  UI.drawerRet?.focus?.();
}
function renderDrawer() {
  const dr = $('#drawer'), x = UI.drawer;
  $('#scrim').classList.toggle('on', Boolean(x));
  if (!x) { dr.classList.remove('on'); dr.dataset.k = ''; return; }
  const key = `${x.kind}|${x.id}`;
  if ((x.kind === 'new-object' || x.kind === 'account') && dr.dataset.k === key) return;  // keep typed input
  const d = S[x.kind]?.find((y) => y.id === x.id);
  const view = x.kind === 'new-object' ? drawerNewObject() : x.kind === 'account' ? drawerAccount()
    : d ? {scene: drawerScene, object: drawerObject, task: drawerTask}[x.kind](d) : {title: '记录不存在', body: ''};
  const scroll = dr.dataset.k === key ? $('#drawer .dr-b')?.scrollTop : 0;
  dr.innerHTML = `<div class="dr-h"><div style="min-width:0;flex:1"><h2 id="drawer-title">${esc(view.title)}</h2>${view.sub ? `<p>${esc(view.sub)}</p>` : ''}</div>
    ${view.actions || ''}<button class="btn btn-icon dr-close" type="button" aria-label="关闭（Esc）" onclick="closeDrawer()">${ic('close')}</button></div>
    <div class="dr-b"${d && x.kind !== 'new-object' ? ` data-kind="${x.kind}" data-id="${esc(d.id)}"` : ''}>${view.body}
    ${d?._by || d?._at ? `<p class="hint" style="margin-top:24px">最近修改：${esc(d._by || '匿名')} · ${fmtTime(d._at)}</p>` : ''}</div>`;
  dr.dataset.k = key;
  dr.classList.add('on');
  if (scroll) $('#drawer .dr-b').scrollTop = scroll;
  if (UI.drawerFocus) { UI.drawerFocus = false; $('#drawer .dr-close').focus({preventScroll: true}); }
}
function onKey(ev) {
  if ($('#lightbox').classList.contains('on')) {
    if (ev.key === 'Escape') closeLB();
    else if (ev.key === 'ArrowLeft') lbStep(-1);
    else if (ev.key === 'ArrowRight') lbStep(1);
    else return;
    ev.preventDefault();
    return;
  }
  if (!ME) return;
  if (ev.key === 'Escape' && UI.drawer) { closeDrawer(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[data-open][tabindex]')) { ev.preventDefault(); ev.target.click(); return; }
  if (UI.tab !== 'qa' || UI.drawer || ev.target.matches('input, textarea, select, video') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const list = qaList(), i = list.findIndex((e) => e.id === UI.ep), k = ev.key.toLowerCase();
  if (k === 'j' || k === 'arrowdown') pick(list[Math.min(i + 1, list.length - 1)]?.id);
  else if (k === 'k' || k === 'arrowup') pick(list[Math.max(i - 1, 0)]?.id);
  else if (UI.ep && k === 'p') setQA('pass');
  else if (UI.ep && k === 'r') setQA('reject');
  else if (UI.ep && k === 'u') setQA('pending');
  else return;
  ev.preventDefault();
}
function onClick(ev) {
  const lb = ev.target.closest('[data-lb]');
  if (lb) { lightbox(GAL[lb.dataset.lb], Number(lb.dataset.i)); return; }
  const g = ev.target.closest('[data-go]');
  if (g) { ev.preventDefault(); go(g.dataset.go, g.dataset.id); return; }
  const o = ev.target.closest('[data-open]');
  if (!o) return;
  const control = ev.target.closest('input, button, a, label, select, textarea, video');
  if (control && control !== o && o.contains(control)) return;  // controls inside a row or card act on their own
  if (o.dataset.open === 'episode') pick(o.dataset.id);
  else openDrawer(o.dataset.open, o.dataset.id, o);
}

// ---------- render ----------
const VIEWS = {overview: viewOverview, scenes: viewScenes, objects: viewObjects, tasks: viewTasks, qa: viewQA, users: viewUsers};
function render() {
  EP_BY_TASK = group(live(S.episode), (e) => e.auto.task);
  renderNav();
  if (!UI.loaded) return;
  const focus = document.activeElement?.id, scroll = $('.qa-list')?.scrollTop, oldVideos = $('#qa-videos'), opening = UI.drawerFocus;
  $('#main').innerHTML = VIEWS[UI.tab]();
  const slot = $('#qa-videos');
  if (oldVideos && slot && oldVideos.dataset.ep === slot.dataset.ep) slot.replaceWith(oldVideos);  // keep playback position
  if (scroll && $('.qa-list')) $('.qa-list').scrollTop = scroll;
  renderDrawer();
  const el = focus && document.getElementById(focus);
  if (el && el !== document.activeElement && !opening) {
    el.focus({preventScroll: true});
    if (el.type === 'text') el.setSelectionRange(el.value.length, el.value.length);
  }
}
const tabFromHash = () => (VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'overview');
window.addEventListener('hashchange', () => { UI.tab = tabFromHash(); UI.drawer = null; render(); window.scrollTo(0, 0); });
document.addEventListener('change', onFieldChange);
document.addEventListener('keydown', onKey);
document.addEventListener('click', onClick);
$('#lightbox').addEventListener('click', (ev) => { if (ev.target.classList.contains('lb-stage')) closeLB(); });
UI.tab = tabFromHash();
renderNav();
fetch('/api/me').then((r) => (r.ok ? r.json() : null)).then((me) => {
  if (!me) return showLogin();
  ME = me;
  return enter();
}).catch((err) => toast(`加载失败：${err.message}`, true));
</script>
</body>
