<title>Real2Sim 数采管理平台</title>

  "three/addons/": "https://registry.npmmirror.com/three/0.169.0/files/examples/jsm/"}}</script>
<style>
:root {
  --bg: #F6F8FB; --surface: #FFFFFF; --surface-2: #F1F5F9; --surface-3: #E8EDF4;
  --border: #E2E8F0; --border-strong: #CBD5E1;
  --text: #0F172A; --text-2: #334155; --muted: #64748B; --faint: #94A3B8;
  --primary: #1E40AF; --primary-hover: #1E3A8A; --primary-soft: #EFF6FF; --primary-line: #BFDBFE; --ring: #2563EB;
  --accent: #D97706; --accent-text: #B45309; --accent-soft: #FEF3C7;
  --ok: #15803D; --ok-soft: #DCFCE7; --ok-bar: #22C55E;
  --bad: #B91C1C; --bad-soft: #FEE2E2; --bad-bar: #EF4444;
  --todo: #475569; --todo-soft: #F1F5F9; --todo-bar: #D5DCE6;
  --radius: 10px; --radius-sm: 6px;
  --shadow-1: 0 1px 2px rgba(15, 23, 42, .05);
  --shadow-2: 0 6px 16px rgba(15, 23, 42, .08);
  --shadow-3: 0 18px 48px rgba(15, 23, 42, .22);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --side: 236px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font: 14px/1.55 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
h1, h2, h3 { letter-spacing: -.01em; }
.mono, code { font-family: var(--mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.txt-bad { color: var(--bad); }
.txt-ok { color: var(--ok); }
.sp { flex: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.ic-sm { width: 13px; height: 13px; }
.ic-lg { width: 18px; height: 18px; }

/* layout */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; z-index: 5; display: flex; flex-direction: column; gap: 18px; height: 100vh; padding: 18px 14px; background: var(--surface); border-right: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; background: var(--primary); color: #fff; font: 700 12px/1 var(--mono); letter-spacing: .03em; }
.brand b { display: block; font-size: 15px; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12px; }
nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border-radius: 8px; color: var(--text-2); font-weight: 500; transition: background .15s, color .15s; }
.nav-item:hover { background: var(--surface-2); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
.nav-item .count { margin-left: auto; color: var(--faint); font: 500 12px var(--mono); }
.nav-item .badge { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font: 600 12px/20px var(--mono); text-align: center; }
.side-foot { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }
.field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
.me { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { display: grid; flex: none; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 650; }
.me-name { min-width: 0; overflow: hidden; line-height: 1.3; }
.me-name b { display: block; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.me-name small { color: var(--muted); font: 11px var(--mono); }
.login { display: grid; min-height: 100vh; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #E0E7FF 0, transparent 40%), var(--bg); }
.login-card { display: flex; flex-direction: column; gap: 14px; width: min(400px, 100%); padding: 28px; box-shadow: var(--shadow-2); }
.login-card h1 { margin: 6px 0 0; font-size: 20px; }
.login-card p { margin: 0; }
.login-card .field { color: var(--text-2); font-size: 13px; font-weight: 500; }
.login-card input:not([type=checkbox]) { width: 100%; min-height: 40px; }
.pw { position: relative; }
.pw input { padding-right: 42px !important; }
.pw .btn { position: absolute; top: 3px; right: 3px; min-height: 34px; border: 0; background: transparent; }
.field-error { margin: 0; color: var(--bad); font-size: 12px; }
.source { color: var(--muted); font-size: 12px; line-height: 1.6; }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; }
.dot.ok { background: var(--ok-bar); }
.dot.warn { background: var(--accent); }
main { min-width: 0; padding: 26px 30px 56px; }
.page { max-width: 1480px; margin: 0 auto; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.ph h1 { margin: 0; font-size: 22px; font-weight: 650; }
.ph p { max-width: 820px; margin: 4px 0 0; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.filters { margin-bottom: 14px; }
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; height: auto; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--border); }
  nav { flex: 1 1 100%; flex-direction: row; order: 3; overflow-x: auto; }
  .nav-item { flex: none; }
  .side-foot { flex-direction: row; align-items: center; margin: 0 0 0 auto; padding: 0; border: 0; }
  .source, .me-name { display: none; }
  main { padding: 18px 14px 40px; }
}

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.card-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.card-b { padding: 12px 16px 16px; }
.section-title { display: flex; align-items: center; gap: 8px; margin: 30px 0 12px; font-size: 15px; font-weight: 600; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fill, minmax(206px, 1fr)); }
.kpi { display: block; padding: 14px 16px 16px; color: inherit; transition: border-color .15s, box-shadow .15s; }
.kpi:hover { border-color: var(--primary-line); box-shadow: var(--shadow-2); text-decoration: none; }
.k-label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
.k-value { margin: 8px 0 2px; font: 600 28px/1.1 var(--mono); letter-spacing: -.02em; }
.k-meta { color: var(--muted); font-size: 12px; }
.pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.duo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1280px) { .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .duo { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .pipeline { grid-template-columns: 1fr; } }
.step { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); font: 700 11px var(--mono); }
.meter { display: grid; grid-template-columns: minmax(96px, 1fr) minmax(60px, 1.2fr) auto; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.meter .lbl { color: var(--text-2); }
.meter .val { min-width: 64px; color: var(--muted); font: 12px var(--mono); text-align: right; }
.callout { display: flex; gap: 10px; margin-bottom: 14px; padding: 10px 12px; border: 1px solid #FDE68A; border-radius: 8px; background: #FFFBEB; color: #92400E; font-size: 13px; }
.callout.bad { border-color: #FECACA; background: #FEF2F2; color: #991B1B; }
.callout.ok { border-color: #BBF7D0; background: #F0FDF4; color: #166534; }
.users { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
@media (max-width: 1000px) { .users { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack .field { color: var(--text-2); font-size: 13px; font-weight: 500; }
.stack input:not([type=checkbox]) { width: 100%; }
.pw-row { display: flex; gap: 6px; }
.pw-row input { flex: 1; min-width: 0; }
.callout .ic { margin-top: 2px; }
.empty { display: grid; place-items: center; gap: 6px; padding: 40px 16px; color: var(--muted); text-align: center; }
.empty .ic { width: 28px; height: 28px; color: var(--faint); }
.empty b { color: var(--text-2); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--text-2); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { border-color: var(--primary); background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ok { border-color: var(--ok); background: var(--ok); color: #fff; }
.btn-ok:hover { background: #166534; }
.btn-bad { border-color: var(--bad); background: var(--bad); color: #fff; }
.btn-bad:hover { background: #991B1B; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-icon { width: 34px; padding: 0; }
.btn-block { width: 100%; }
.btn-lg { min-height: 44px; }
kbd { padding: 0 5px; border: 1px solid currentColor; border-radius: 4px; font: 500 11px/16px var(--mono); opacity: .75; }
input:not([type=checkbox]):not([type=file]), select, textarea { min-height: 34px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); transition: border-color .15s; }
input:not([type=checkbox]):not([type=file]):hover, select:hover, textarea:hover { border-color: var(--faint); }
input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); cursor: pointer; }
textarea { width: 100%; min-height: 72px; resize: vertical; }
select { cursor: pointer; }
.search { position: relative; }
.search .ic { position: absolute; top: 9px; left: 10px; color: var(--muted); pointer-events: none; }
.search input { width: 230px; padding-left: 32px !important; }
.check { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; color: var(--text-2); cursor: pointer; }
.segctl { display: inline-flex; padding: 2px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-2); }
.segctl button { min-height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); font-weight: 500; cursor: pointer; }
.segctl button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-1); }

/* status */
.st { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border: 1px solid transparent; border-radius: 999px; background: var(--todo-soft); color: var(--todo); font-size: 12px; font-weight: 500; white-space: nowrap; }
.st .ic { width: 12px; height: 12px; }
.st.ok { background: var(--ok-soft); color: var(--ok); }
.st.bad { background: var(--bad-soft); color: var(--bad); }
.st.warn { background: var(--accent-soft); color: var(--accent-text); }
.st.na { background: transparent; border: 1px dashed var(--border-strong); color: var(--faint); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); font: 500 12px var(--mono); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.togglechip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--text-2); font-size: 12px; cursor: pointer; }
.togglechip[aria-pressed="true"] { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.seg { display: flex; flex: 1; gap: 2px; min-width: 60px; }
.seg i { flex: 1; height: 6px; border-radius: 2px; background: var(--todo-bar); }
.seg i.ok { background: var(--ok-bar); }
.seg i.bad { background: var(--bad-bar); }
.seg i.na { background: repeating-linear-gradient(45deg, #E2E8F0 0 2px, #F8FAFC 2px 4px); }
.progress-row { display: flex; align-items: center; gap: 10px; }
.bar { display: flex; height: 8px; overflow: hidden; border-radius: 999px; background: var(--surface-3); }
.bar i { display: block; height: 100%; }
.bar .ok { background: var(--ok-bar); }
.bar .bad { background: var(--bad-bar); }
.bar .pri { background: var(--primary); }

/* tables */
.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-1); }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
th { position: sticky; top: 0; z-index: 1; background: #F8FAFC; color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr[data-open] { cursor: pointer; }
tr[data-open]:hover td { background: #F8FAFC; }
tr.sel td, tr.sel:hover td { background: var(--primary-soft); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.t-main { font-weight: 600; }
.t-sub { color: var(--muted); font-size: 12px; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-all; }
table.plain { font-size: 13px; }
table.plain th, table.plain td { position: static; padding: 7px 8px; background: none; }

/* media */
.scene-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.cards { grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); }
.mcard { overflow: hidden; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.mcard:hover { border-color: var(--primary-line); box-shadow: var(--shadow-2); }
.media { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--surface-2); color: var(--faint); }
.media.r169 { aspect-ratio: 16 / 9; }
.media.r43 { aspect-ratio: 4 / 3; }
.media > img { display: block; width: 100%; height: 100%; object-fit: cover; }
.media .inset { position: absolute; right: 8px; bottom: 8px; width: 34%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border: 2px solid #fff; border-radius: 6px; box-shadow: var(--shadow-2); }
.media .pills { position: absolute; top: 8px; right: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; background: rgba(15, 23, 42, .72); color: #fff; font: 500 11px var(--mono); }
.m3d { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: #EEF2F7; }
.m3d:fullscreen { border: 0; border-radius: 0; }
.m3d canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.m3d canvas:active { cursor: grabbing; }
.m3d-status { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; color: var(--muted); font-size: 13px; text-align: center; pointer-events: none; }
.m3d-bar { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.m3d-bar .btn { min-height: 28px; padding: 3px 9px; font-size: 12px; background: rgba(255, 255, 255, .9); }
.m3d-hint { position: absolute; left: 8px; bottom: 8px; padding: 2px 7px; border-radius: 6px; background: rgba(15, 23, 42, .6); color: #fff; font-size: 11px; pointer-events: none; }
.vcard { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); text-align: left; cursor: pointer; }
.vcard:hover { border-color: var(--primary-line); }
.vcard > span:last-child { display: grid; min-width: 0; }
.vcard b { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.mcard-b { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 12px; }
.mcard-t { display: flex; align-items: baseline; gap: 8px; }
.mcard-t b { overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
.thumb { display: grid; place-items: center; width: 56px; height: 42px; overflow: hidden; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--faint); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 8px; }
.ra-group { margin-bottom: 26px; }
.ra-group-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin: 0 0 10px; }
.ra-group-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ra-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.ra-card { display: flex; flex-direction: column; width: 100%; min-width: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: inherit; font: inherit; text-align: left; }
.ra-card:focus-visible { outline: 3px solid var(--primary-line); outline-offset: 2px; }
.ra-cover { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; overflow: hidden; border-bottom: 1px solid var(--border); background: #F1F5F9; }
.ra-cover img { width: 100%; height: 100%; object-fit: contain; }
.ra-cover .pills { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; }
.ra-cover.is-empty { aspect-ratio: auto; height: 84px; }
.ra-empty { display: grid; justify-items: center; gap: 6px; color: var(--faint); font-size: 12px; }
.ra-body { display: flex; flex: 1; flex-direction: column; gap: 8px; padding: 12px 14px 14px; }
.ra-body h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.4; }
.ra-status { color: var(--text-2); font-size: 12px; line-height: 1.5; }
.ra-sum { display: -webkit-box; overflow: hidden; color: var(--muted); font-size: 12px; line-height: 1.6; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.ra-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.ra-meta span { display: inline-flex; align-items: center; gap: 4px; }
.ra-checks { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.ra-checks li { display: grid; grid-template-columns: 20px minmax(96px, 30%) 1fr; gap: 8px; align-items: start; font-size: 13px; line-height: 1.55; }
.ra-checks li .ic { margin-top: 3px; }
.ra-checks .done .ic { color: var(--ok); }
.ra-checks .open .ic { color: var(--todo); }
.ra-checks b { font-weight: 500; }
.ra-videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ra-videos figure { margin: 0; }
.ra-videos video { display: block; width: 100%; border: 1px solid var(--border); border-radius: 8px; background: #0F172A; }
.ra-videos figcaption { margin-top: 4px; color: var(--muted); font: 12px var(--mono); }

.gthumb { position: relative; display: block; aspect-ratio: 4 / 3; padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); cursor: zoom-in; }
.gthumb img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .2s; }
.gthumb:hover img { transform: scale(1.03); }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .compare { grid-template-columns: 1fr; } }
.compare figure { margin: 0; min-width: 0; }
.compare figcaption { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
.hero { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--muted); cursor: zoom-in; }
.hero img { display: block; width: 100%; height: 100%; object-fit: cover; }
.hero.empty-hero { gap: 6px; padding: 16px; cursor: default; font-size: 12px; text-align: center; }
.strip { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
.strip .item { position: relative; flex: none; }
.strip .gthumb { width: 64px; }

.wz-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
@media (max-width: 560px) { .wz-grid { grid-template-columns: 1fr; } .wz-t { display: none; } .wz-steps button.on .wz-t { display: inline; } }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.fld > label { color: var(--text-2); font-size: 12.5px; font-weight: 550; }

.wz-id { display: flex; align-items: center; min-height: 34px; padding: 6px 10px; border: 1px dashed var(--primary-line); border-radius: 8px; background: var(--primary-soft); color: var(--primary); font-size: 12.5px; overflow-wrap: anywhere; }
.wz-id.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.unit { display: flex; }
.unit input { flex: 1; min-width: 0; border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important; }
.unit span { display: grid; place-items: center; padding: 0 12px; border: 1px solid var(--border-strong); border-left: 0; border-radius: 0 8px 8px 0; background: var(--surface-2); color: var(--muted); font-size: 12.5px; }
.drop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 16px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface-2); color: var(--text-2); text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
.drop b { font-weight: 600; }
.drop small { color: var(--muted); font-size: 12px; }
.drop-ic { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 4px; border-radius: 50%; background: var(--surface); color: var(--primary); box-shadow: var(--shadow-1); }
.drop-ic .ic { width: 20px; height: 20px; }
.drop.over, .drop:hover { border-color: var(--ring); background: var(--primary-soft); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
.wz-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.wz-thumbs:not(:empty) { margin-top: 12px; }
.wz-thumb { position: relative; margin: 0; }
.wz-thumb img { display: block; width: 100%; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 8px; object-fit: cover; }
.wz-thumb figcaption { margin-top: 4px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.wz-thumb button { position: absolute; top: 5px; right: 5px; display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: rgba(15, 23, 42, .7); color: #fff; cursor: pointer; }

.toggle span { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 16px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--text-2); cursor: pointer; transition: all .15s; }

.presets button { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border: 1px dashed var(--border-strong); border-radius: 999px; background: none; color: var(--text-2); font-size: 12px; cursor: pointer; }

.wz-foot { position: sticky; bottom: -48px; z-index: 1; display: flex; align-items: center; gap: 12px; margin: 24px -22px -48px; padding: 14px 22px; border-top: 1px solid var(--border); background: rgba(255, 255, 255, .94); backdrop-filter: blur(6px); }

.wz-foot .btn { min-height: 40px; padding: 0 16px; }
.nt-role, .nt-level { margin-top: 10px; padding: 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius); }
.nt-role:first-child, .nt-level:first-child { margin-top: 0; }
.nt-level > .toggle { display: inline-block; margin-bottom: 10px; }

.nt-level-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.nt-level:not(.off) .nt-level-h { margin-bottom: 10px; }
.pair { display: flex; gap: 8px; }
.pair input { flex: 1; min-width: 0; }
.fld .chips:not(:empty) { margin-bottom: 6px; }

.lb-stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 0 64px 24px; }

.lb-nav:hover { background: rgba(255, 255, 255, .18); }
.lb-prev { left: 12px; }
.lb-next { right: 12px; }
#toast { position: fixed; bottom: 24px; left: 50%; z-index: 40; display: flex; align-items: center; gap: 8px; max-width: min(560px, 92vw); padding: 10px 14px; border-radius: 10px; background: #0F172A; color: #fff; box-shadow: var(--shadow-3); font-size: 13px; opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: opacity .2s, transform .2s; }

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const file = (p) => `/file?path=${encodeURIComponent(p)}`;
const num = (v) => v !== null && v !== undefined && v !== '' && !Number.isNaN(Number(v));
const pct = (x) => (num(x) ? `${Math.round(x * 100)}%` : '—');
const sum = (xs) => xs.reduce((a, b) => a + b, 0);
const fmtTime = (t) => (t ? new Date(t * 1000).toLocaleString('zh-CN', {hour12: false}) : '');
const live = (xs) => xs.filter((d) => !d.auto?.missing);
const group = (xs, key) => xs.reduce((m, x) => ((m[key(x)] ||= []).push(x), m), {});
const rel = (p) => (p && INFO.root && p.startsWith(`${INFO.root}/`) ? p.slice(INFO.root.length + 1) : p);
const base = (p) => String(p).split('/').pop();
const opts = (options, value) => Object.entries(options).map(([k, l]) => `<option value="${esc(k)}" ${k === String(value ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

const KINDS = ['scene', 'object', 'task', 'episode', 'embodiment', 'evaluation', 'prototype'];
const TAB_OF = {scene: 'scenes', object: 'objects', task: 'tasks', episode: 'qa', embodiment: 'robots', evaluation: 'evals', prototype: 'prototypes'};
const KIND_LABEL = {scene: '场景', object: '物体', task: '任务', episode: '回合', embodiment: '本体', evaluation: '评测', prototype: '研究资产'};
const S = {scene: [], object: [], task: [], episode: [], embodiment: [], evaluation: [], prototype: []};
const UI = {
  tab: 'overview', drawer: null, ep: null, taskDim: 'custom', taskQ: '', sel: new Set(), loaded: false, syncing: false, syncedAt: '',
  obj: {q: '', src: '', photo: false, view: localStorage.objView || 'cards'},
  qa: {task: '', config: '', policy: '', result: '', status: 'pending'},
};
let INFO = {};
let ME = null;
let USERS = [];
let MEMBERS = [];  // [{username, name}] of every account, to pick owners from
const memberName = (u) => MEMBERS.find((m) => m.username === u)?.name || u || '';
const memberOpts = (value) => ({'': '未指定', ...Object.fromEntries(MEMBERS.map((m) => [m.username, `${m.name}（${m.username}）`])),
  ...(value && !MEMBERS.some((m) => m.username === value) ? {[value]: `${value}（不是平台账号）`} : {})});
let IDX = {};  // indices in use per <type>/<category>, for registering objects
let EP_BY_TASK = {};
const GAL = {};

// ---------- stages: [key, label, doc -> {s: ok | bad | todo | na, t: detail}] ----------
const ok = (t = '') => ({s: 'ok', t});
const bad = (t = '') => ({s: 'bad', t});
const todo = (t = '') => ({s: 'todo', t});
const na = (t = '') => ({s: 'na', t});
const flag = (v, hint) => (v ? ok('已完成') : todo(hint));
const STATE = {ok: '通过', bad: '不通过', todo: '待办', na: '不适用'};
const STATE_IC = {ok: 'check', bad: 'x', todo: 'circle', na: 'minus'};
const evalStages = (stages, d) => stages.map(([k, label, fn]) => ({k, label, ...fn(d)}));
const allOk = (stages, d) => evalStages(stages, d).every((r) => r.s === 'ok' || r.s === 'na');

const MIN_SCENE_PHOTOS = 5;
const sceneTopZ = (d) => (num(d.measured_top_z) ? Number(d.measured_top_z) : num(d.reg?.top_z_cm) ? d.reg.top_z_cm / 100 : null);
const SCENE_STAGES = [
  ['photos', `照片 ≥ ${MIN_SCENE_PHOTOS} 张`, (d) => {
    const n = d.auto.photos?.length || 0;
    return n >= MIN_SCENE_PHOTOS ? ok(`${n} 张参考照片`) : todo(`reference/ 下 ${n} 张，至少 ${MIN_SCENE_PHOTOS} 张不同角度`);
  }],
  ['fit', '相机拟合', (d) => (!d.auto.fit_views ? todo('没有 fit_photo.json 或 cameras_scene.json')
    : ok(d.auto.fit_max_px == null ? `${d.auto.fit_views} 个 SfM 相机` : `${d.auto.fit_views} 个视角，最大残差 ${d.auto.fit_max_px} px`))],
  ['build', 'USD 构建', (d) => (d.auto.built ? ok(d.auto.rooms.join('、')) : todo('缺 usd/scene.usda 或 Room 入口'))],
  ['check', '离线检查', (d) => (!d.auto.checks_total ? todo('没有 check_report.json')
    : d.auto.checks_failed.length ? bad(`${d.auto.checks_failed.length}/${d.auto.checks_total} 项未通过`) : ok(`${d.auto.checks_total} 项全部通过`))],
  ['measure', '尺寸实测 < 1 cm', (d) => {
    const top = sceneTopZ(d);
    if (top == null) return todo('卷尺实测桌高、桌沿相对机器人的位置');
    if (!num(d.auto.top_z)) return todo(`实测桌高 ${top} m，模型还没建`);
    const dz = Math.abs(top - d.auto.top_z) * 100;
    const edge = num(d.edge_err_cm) ? Math.abs(d.edge_err_cm) : null;
    const text = `桌高差 ${dz.toFixed(1)} cm，${edge == null ? '桌沿未实测' : `桌沿差 ${edge} cm`}`;
    if (dz >= 1 || edge >= 1) return bad(text);
    return edge == null ? todo(text) : ok(text);
  }],
  ['overlay', '叠图 < 5 px（≥ 3 视角）', (d) => {
    if (!num(d.overlay_px)) return todo('用标定好的头部相机把仿真渲染和真机照片叠图');
    const text = `最大偏差 ${d.overlay_px} px，${d.overlay_views || 0} 个视角`;
    return d.overlay_px < 5 && d.overlay_views >= 3 ? ok(text) : bad(text);
  }],
  ['lighting', '灯光建模', (d) => flag(d.lighting, '按现场记录建模灯的类型、位置和大致亮度')],
  ['isaac', 'Isaac 渲染验证', (d) => flag(d.isaac, 'RTX 渲染，与真机头部相机画面对比')],
  ['shared', '入共享资产库', (d) => flag(d.shared, 'build_asset.py 装入 Assets/Room/ 并生成布局')],
];

const MATERIALS = ['PP 塑料', 'PET 塑料', 'PS 塑料', '玻璃', '陶瓷', '不锈钢', '铝', '木', '纸', '硅胶', '布'];
const OBJECT_TYPES = {Rigid: '刚体', Articulation: '关节物体', Clutter: '杂物', Dynamic: '动态装置', Fluid: '流体', Garment: '衣物', Geometry: '固定物体'};
const METHODS = {'': '未定', script: '参数化脚本', photogrammetry: '摄影测量', generative: '3D 生成模型', library: '开源 / 官方物体库'};
const CHECK_STATES = {'': '未测', pass: '通过', fail: '不通过', na: '不适用'};
const PHYS = [
  ['settle', '落地静置', '1 s 内稳定，倾斜 < 1°，速度 < 5 mm/s', (d) => `PYTHONPATH=. python scripts/objects/check_object.py Assets/Object/RoboDojo/${d.id} --image-dir real2sim/objects`],
  ['collision', '碰撞体', '与桌面、其他物体初始无穿插；容器口没被碰撞体封住', () => ''],
  ['grasp', '抓取', 'Dex1 用脚本抓起，保持 3 s 不滑落', () => ''],
  ['liquid', '盛液（仅容器）', '静置时液体保留率 ≥ 99%',
    () => 'PYTHONPATH=. python scripts/objects/check_pitcher_fluid.py --device cpu --out output/pitcher/fluid   # 壶\nPYTHONPATH=. python scripts/objects/check_cup_beans.py --out output/plastic_cups/beans   # 杯子装豆'],
  ['render', '光照渲染', '3 种灯光预设下截图，无穿透、黑面、折射错误；人工复核', () => ''],
];
// "开口直径 82，底部直径 64，高 135" -> [{name, real}] in mm; a unit right after a number is not part of the next name
const SEP = /\s*[×xX*]\s*/;
const expandDims = (text) => String(text || '').replace(  // "(高 × 宽 × 厚)：46.4 × 54.4 × 21.4" -> "高 46.4，宽 54.4，厚 21.4"
  /[^\d\s，,；;、:：=+（(]*[（(]([^）)]+)[）)]\s*[:：=]?\s*(\d+(?:\.\d+)?(?:\s*[×xX*]\s*\d+(?:\.\d+)?)+)/g,
  (all, names, values) => {
    const n = names.trim().split(SEP), v = values.split(SEP);
    return n.length === v.length ? n.map((x, i) => `${x} ${v[i]}`).join('，') : all;
  });
const parseDims = (text) => [...expandDims(text).matchAll(/([^\d\s，,；;、:：=+]+)\s*[:：=]?\s*(\d+(?:\.\d+)?)/g)]
  .map((m) => ({name: m[1].replace(/^(mm|毫米)/i, ''), real: Number(m[2])})).filter((r) => r.name);
const dimText = (d) => parseDims(d.dimensions).map((r) => `${r.name} ${r.real}`).join(' · ');
const measured = (d) => num(d.real_mass) && parseDims(d.dimensions).length > 0;
function dimCheck(d) {  // each measured dimension against the built model's metadata.json measurements_mm, by name
  return parseDims(d.dimensions).map(({name, real}) => {
    const meta = d.auto.measurements?.[name], sim = num(meta) ? Number(meta) : null, err = sim == null ? null : Math.abs(sim - real);
    return {name, real, sim, err, ok: err != null && err <= Math.max(2, 0.02 * real)};
  });
}
// a verdict picked in the page wins; otherwise preview/check.json: settle from check_object.py, the rest from the agent
const autoPhys = (d, k) => d.auto.check?.checks?.[k] || (k === 'settle' ? d.auto.check?.settle : '') || '';
const physState = (d, k) => d.checks?.[k] || (['pass', 'fail', 'na'].includes(autoPhys(d, k)) ? autoPhys(d, k) : '');
const OBJ_STAGES = [
  ['measure', '实物测量', (d) => (!d.twin ? na('非实物孪生') : measured(d) ? ok(`${dimText(d)} mm，${d.real_mass} g`)
    : todo('量关键尺寸 ±1 mm（如开口直径、底部直径、高）、称重、拍多角度照片'))],
  ['model', '建模', (d) => (d.auto.in_library ? ok(d.method ? METHODS[d.method] : '资产库中已有')
    : d.auto.check?.checked_at ? ok(`已建好，${d.auto.check.checked_at} 落地检查${d.auto.check.settle === 'pass' ? '通过' : '不通过'}`)
    : todo(d.auto.generator ? `有生成脚本 ${d.auto.generator}，还没有建好的资产` : '交给 coding agent 按建模任务建模'))],
  ['dims', '尺寸 / 质量核对', (d) => {
    if (!d.twin) return na('非实物孪生');
    if (!measured(d)) return todo('先填实测尺寸和质量');
    const c = dimCheck(d), done = c.filter((x) => x.sim != null), over = done.filter((x) => !x.ok);
    if (!done.length || !num(d.auto.mass)) return todo('建好后在 metadata.json 按实测尺寸的名称写 measurements_mm');
    const dm = Math.abs(d.auto.mass * 1000 - d.real_mass);
    const text = `${done.length}/${c.length} 项已核对${over.length ? `，${over.map((x) => x.name).join('、')} 超差` : ''}，质量差 ${dm.toFixed(0)} g`;
    return over.length || dm > 5 ? bad(text) : done.length < c.length ? todo(text) : ok(text);
  }],
  ['physics', '物理检验', (d) => {
    const v = PHYS.map(([k]) => physState(d, k));
    if (v.includes('fail')) return bad(`${v.filter((x) => x === 'fail').length} 项不通过`);
    const done = v.filter((x) => x === 'pass' || x === 'na').length;
    return done === PHYS.length ? ok('5 项通过') : todo(`${done}/${PHYS.length} 项完成`);
  }],
  ['library', '入共享库', (d) => (d.auto.in_library ? ok('资产库中已有') : todo(d.auto.built
    ? '经同意装进服务器共享资产库，再刷新平台的资产库镜像' : '建好之后'))],
];

const DIMS = {custom: 'G1-D 自建', generalization: '泛化', memory: '记忆', precision: '精细', 'long-horizon': '长程', open: '开放'};
const LEVELS = [
  ['L0', '孪生', '无变化，与真机评测一一对应：真实工位、真实物体、打印摆放垫上的位置', 25],
  ['L1', '位置', '物体位置和朝向：可达范围内 y ≈ [-0.55, -0.25]，旋转 ±30°', 50],
  ['L2', '外观', '亮度 ×0.5–2、色温 3000–6500 K、灯的位置；桌面 / 地面 / 背景纹理；头部相机 ±1 cm / ±2°，腕部 ±0.5 cm / ±2°', 50],
  ['L3', '物体', '保留实例（没见过的尺寸、颜色、材质）+ 3–8 个干扰物', 50],
  ['L4', '场景', '2 个不进训练的场景（如厨房台面、窄桌），桌高 ±5 cm', 50],
];
const experts = (eps) => eps.filter((e) => e.auto.policy === 'scripted_demo');
const rate = (eps) => (eps.length ? eps.filter((e) => e.auto.success).length / eps.length : null);

const CAM_ORDER = ['head', 'head_right', 'left_wrist', 'right_wrist'];
const camRank = (c) => (CAM_ORDER.includes(c) ? CAM_ORDER.indexOf(c) : 99);

  }],

const QA_STAGE = ['qa', '人工质检', (e) => (e.qa === 'pass' ? ok('通过') : e.qa === 'reject' ? bad('拒绝') : todo('待审'))];

const TAGS = ['够不到', '抓取滑脱', '穿模 / 碰撞', '洒出 / 漏出', '超速 / 抖动', '物体不稳', '画面异常', '判定误报', '其他'];

function simReal(eps) {
  const pairs = eps.filter((e) => e.real === 'success' || e.real === 'fail');
  if (!pairs.length) return null;
  let a = 0, b = 0, c = 0, d = 0;
  for (const e of pairs) {
    const sim = e.auto.success, real = e.real === 'success';
    if (sim && real) a++; else if (sim) b++; else if (real) c++; else d++;
  }
  const n = pairs.length, A = (a + d) / n, pe = ((a + b) * (a + c) + (c + d) * (b + d)) / (n * n);
  return {n, a, b, c, d, A, kappa: pe < 1 ? (A - pe) / (1 - pe) : null, trust: a + b ? a / (a + b) : null};
}

function v3dFromFixed() {

async function saveAppearance(id) {
  const n = (v) => (v === '' || v == null ? null : Number(v)), fixed = {table_top_z: n(AP.z)}, random = {};
  Object.keys(SURFACES).forEach((k) => {
    fixed[k] = AP.fix[k][0] || null;
    const pool = [...AP.rnd[k], ...(AP.orig[k] ? ['original'] : [])];
    if (pool.length) random[k] = pool;
  });
  if (n(AP.zlo) != null || n(AP.zhi) != null) random.table_top_z = [n(AP.zlo), n(AP.zhi)];
  try {
    const doc = await api(`/api/items?kind=scene&id=${encodeURIComponent(id)}`, {method: 'PUT', body: JSON.stringify({appearance: {fixed, random}})});
    S.scene[S.scene.findIndex((x) => x.id === id)] = doc;
    toast(doc.auto.appearance ? '已保存到 appearance.json' : '已清空，场景按原样使用');
    render();
  } catch (err) { toast(`保存失败：${err.message}`, true); }
}

  const stem = `${slug}-${new Date().toLocaleDateString('sv').replace(/-/g, '')}`;

async function saveRandomization(id, clear = false) {
  const n = (v) => (v === '' || v == null ? null : Number(v)), r = RS, dirOf = (m) => m.replace(/^mdl\//, '');
  const profile = clear ? null : {position: r.position, yaw: r.yaw, instances: r.instances,
    rooms: r.rooms, tables: r.tables.map(dirOf), grounds: r.grounds.map(dirOf)};
  if (profile && r.bgOn) profile.background = {hdrs: r.hdrs, intensity: n(r.bgLo) == null && n(r.bgHi) == null ? null : [n(r.bgLo), n(r.bgHi)]};
  if (profile && r.liOn) profile.lights = {count: [n(r.liN0), n(r.liN1)], types: r.types, intensity: [n(r.liLo), n(r.liHi)], color_temperature: [n(r.ctLo), n(r.ctHi)]};
  if (profile && r.clOn) profile.clutter = {count: [n(r.clLo), n(r.clHi)], categories: r.cats};
  if (profile && r.camOn) profile.camera = {ori_deg: n(r.camOri)};
  try {
    const doc = await api(`/api/items?kind=task&id=${encodeURIComponent(id)}`, {method: 'PUT', body: JSON.stringify({randomization: profile})});
    S.task[S.task.findIndex((x) => x.id === id)] = doc;
    if (clear) RS = null;
    toast(doc.auto.randomization ? '已保存到 randomization.json' : '已清除随机方案');
    render();
  } catch (err) { toast(`保存失败：${err.message}`, true); }
}

function taskWizError() {  // [message, field selector] blocking the current step, or ['']

    if (!$('#nt-name').value.trim()) return ['填写中文名称', '#nt-name'];
    if (!$('#nt-name-en').value.trim()) return ['填写英文名称', '#nt-name-en'];
    const id = taskIdError();
    if (id[0]) return id;
    if (!$('#nt-definition').value.trim()) return ['用中文写下任务定义，coding agent 据此总结语言指令', '#nt-definition'];
    const n = Number($('#nt-inst-n').value);

    if (!$('#nt-success').value.trim()) return ['写下成功判据，否则无法实现 run_reward', '#nt-success'];
  }
  if (WIZ_AT === 1) {
    const labels = NT.roles.map((r) => r.label);
    const i = NT.roles.findIndex((r) => !/^\w+$/.test(r.label) || labels.indexOf(r.label) !== labels.lastIndexOf(r.label));
    if (i >= 0) return ['每个角色要有唯一的 label（字母、数字、下划线）', `#nt-role-${i}`];

    const k = NT.roles.findIndex((r) => !(r.count >= 1));

// ---------- actions ----------
async function api(url, options = {}) {
  const r = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...options});
  if (r.status === 401 && ME && url !== '/api/password') { showLogin('登录已过期，请重新登录'); throw new Error('请先登录'); }
  if (!r.ok) throw new Error((await r.json().catch(() => null))?.error || `${r.status} ${r.statusText}`);
  return r.json();
}
function showLogin(message = '') {
  ME = null;
  UI.drawer = null;
  renderDrawer();
  closeLB();
  $('#main').innerHTML = '';
  document.querySelector('.app').hidden = true;
  $('#login').hidden = false;
  $('#lg-err').textContent = message;
  $('#lg-user').setAttribute('aria-invalid', String(Boolean(message)));
  ($('#lg-user').value ? $('#lg-pass') : $('#lg-user')).focus();
}
async function doLogin() {
  const btn = $('#lg-btn'), username = $('#lg-user').value.trim(), password = $('#lg-pass').value;
  if (!username || !password) { $('#lg-err').textContent = '请输入用户名和密码'; return; }
  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    ME = await api('/api/login', {method: 'POST', body: JSON.stringify({username, password})});
    $('#lg-pass').value = '';
    $('#lg-err').textContent = '';
    await enter();
  } catch (err) {
    $('#lg-err').textContent = err.message;
    $('#lg-pass').select();
  }
  btn.disabled = false;
  btn.textContent = '登录';
}
async function logout() {
  await fetch('/api/logout', {method: 'POST'}).catch(() => null);
  KINDS.forEach((k) => { S[k] = []; });
  USERS = [];
  UI.loaded = false;
  UI.cred = UI.nu = null;
  showLogin();
}
async function enter() {
  $('#login').hidden = true;
  document.querySelector('.app').hidden = false;
  INFO = await api('/api/info');
  USERS = ME.admin ? await api('/api/users') : [];
  renderNav();
  await load();
}
function togglePw(btn) {
  const input = btn.previousElementSibling, show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.setAttribute('aria-pressed', String(show));
  btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
  btn.innerHTML = ic(show ? 'eye-off' : 'eye');
}

async function copyCode(btn) {

// registration wizards keep their form when the drawer closes or switches away (a stray click on the scrim, Esc, another

const DRAFTS = {};
const WIZ_OPENERS = () => ({'new-object': openNewObject, 'new-scene': openNewScene, 'new-task': openNewTask, 'new-robot': openNewRobot, 'new-eval': openNewEval});
const formState = () => JSON.stringify([...$$('#drawer .dr-b input, #drawer .dr-b textarea, #drawer .dr-b select')]
  .filter((e) => e.type !== 'file').map((e) => (e.type === 'checkbox' || e.type === 'radio' ? e.checked : e.value)));
function wizardDirty(kind) {

  const lists = kind === 'new-task' ? NT && [...NT.roles.flatMap((r) => [...r.candidates, ...r.holdout]), ...NT.dis.candidates, ...NT.dis.holdout, ...NT.scenes.train, ...NT.scenes.holdout].length

}

}
function restoreDraft(kind, btn) {  // true if the wizard reopened with its kept form

  dr.replaceChildren(...draft.nodes);
  dr.dataset.k = `${kind}|new`;  // renderDrawer keeps a wizard whose key is unchanged

  dr.classList.add('on');
  dr.querySelector('.draft-note')?.remove();
  dr.querySelector('.dr-b').insertAdjacentHTML('afterbegin', `<div class="callout draft-note">${ic('refresh')}<div>已恢复上次没提交的内容。<span class="sp"></span>

function renderDrawer() {

    : d ? {scene: drawerScene, object: drawerObject, task: drawerTask, embodiment: drawerRobot, evaluation: drawerEval, prototype: drawerPrototype}[x.kind](d) : {title: '记录不存在', body: ''};

    ${d?._by || d?._at ? `<p class="hint" style="margin-top:24px">最近修改：${esc(d._by || '匿名')} · ${fmtTime(d._at)}</p>` : ''}</div>`;

// scene 3D view of preview/scene.glb (scripts/scenes/export_glb.py, Y-up, room under /World/Background). The drawer is
// re-rendered on every change, so the live viewer node is put back in place of the new slot; closing the drawer frees it
let VIEWER = null;
function mountModel() {

  VIEWER?.stop();

}
function startViewer(el) {
  const v = {url: el.dataset.model, el, stopped: false, stop() { this.stopped = true; this.free?.(); }};
  const status = el.querySelector('.m3d-status');
  Promise.all(['three', 'three/addons/controls/OrbitControls.js', 'three/addons/loaders/GLTFLoader.js', 'three/addons/environments/RoomEnvironment.js'].map((m) => import(m)))
    .then(async ([THREE, {OrbitControls}, {GLTFLoader}, {RoomEnvironment}]) => {
      if (v.stopped) return;
      status.textContent = '加载模型…';
      const gltf = await new GLTFLoader().loadAsync(v.url, (e) => {
        status.textContent = `加载模型 ${e.total ? `${Math.round((100 * e.loaded) / e.total)}%` : `${(e.loaded / 1e6).toFixed(1)} MB`}`;
      });
      if (v.stopped) return;
      const canvas = el.querySelector('canvas'), renderer = new THREE.WebGLRenderer({canvas, antialias: true});
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = THREE.NeutralToneMapping;
      const scene = new THREE.Scene(), pmrem = new THREE.PMREMGenerator(renderer);
      scene.background = new THREE.Color(0xeef2f7);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      const sun = new THREE.DirectionalLight(0xffffff, 1.0);
      sun.position.set(2, 6, 3);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.5), sun, gltf.scene);
      // walls and ceiling are single-sided and face inward, so they drop out when looking in from outside the room
      const meshes = [];
      gltf.scene.traverse((o) => o.isMesh && meshes.push(o));
      const inRoom = (o) => (o.userData.name || '').startsWith('/World/Background/');  // the USD path; o.name drops "/"
      v.room = meshes.filter((o) => inRoom(o) && !/\/Floor/i.test(o.userData.name));
      const focus = new THREE.Box3();
      for (const o of meshes.filter((m) => !inRoom(m))) focus.expandByObject(o);
      if (focus.isEmpty()) focus.setFromObject(gltf.scene);
      const centre = focus.getCenter(new THREE.Vector3()), size = focus.getSize(new THREE.Vector3()).length();
      const camera = new THREE.PerspectiveCamera(45, 1, 0.02, 200), controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.screenSpacePanning = true;
      controls.maxPolarAngle = 0.49 * Math.PI;  // stay above the floor
      v.reset = () => {  // front-right, above: the robot stands at -y in USD, which is +z here
        camera.position.copy(centre).addScaledVector(new THREE.Vector3(0.55, 0.6, 1).normalize(), el.dataset.compact ? 1.6 * size : 1.1 * size + 0.8);
        controls.target.copy(centre);
        controls.update();
      };
      v.toggleRoom = (btn) => {
        const show = !v.room[0]?.visible;
        for (const o of v.room) o.visible = show;
        btn.textContent = show ? '隐藏房间' : '显示房间';
      };
      // material swaps, lighting and desk height from the drawer's AP state, on the usd/parts.json meshes (GLB nodes
      // are named by USD path, positions baked in metres with Y up)
      const hemi = scene.children.find((o) => o.isHemisphereLight), byPath = new Map(), made = new Map();
      for (const o of meshes) {
        const name = o.userData.name || o.parent?.userData.name;
        if (name) byPath.set(name, [...(byPath.get(name) || []), o]);
        o.userData.orig = {material: o.material, y: o.position.y, sy: o.scale.y};
      }
      const at = (rel) => byPath.get(`/World/${rel}`) || [];
      // decor standing on the desk that only the preview model has (the sim Room leaves it out): rises with the top
      const desk = (() => {
        const p = S.scene.find((x) => x.id === el.dataset.scene)?.auto.parts;
        if (!p?.lift) return [];
        const top = new THREE.Box3(), lifted = new Set([...p.lift.move, ...p.lift.stretch.map((s) => s[0])].map((r) => `/World/${r}`));
        for (const part of p.roles.tabletop.parts) for (const o of at(part.path)) top.expandByObject(o);
        if (top.isEmpty()) return [];
        return meshes.filter((o) => {
          if (lifted.has(o.userData.name)) return false;
          const b = new THREE.Box3().setFromObject(o), c = b.getCenter(new THREE.Vector3());
          return b.min.y > p.top_z - 0.005 && b.min.y < p.top_z + 0.03 && c.x > top.min.x && c.x < top.max.x && c.z > top.min.z && c.z < top.max.z;

        for (let i = 0; i < p.count; i++) {
          const ax = [Math.abs(n.getX(i)), Math.abs(n.getY(i)), Math.abs(n.getZ(i))];
          const [u, w] = ax[0] >= ax[1] && ax[0] >= ax[2] ? [p.getZ(i), p.getY(i)] : ax[1] >= ax[2] ? [p.getX(i), p.getZ(i)] : [p.getX(i), p.getY(i)];

        if (made.has(key)) return made.get(key);
        const mat = new THREE.MeshStandardMaterial({roughness: m.roughness ?? 0.6, metalness: m.metallic ?? (m.category === 'metal' ? 0.7 : 0)});

        const g = t <= 66 ? c(99.47 * Math.log(t) - 161.12) : c(288.12 * (t - 60) ** -0.0755);

      v.sync = () => {
        const ap = AP?.id === el.dataset.scene ? AP : null, parts = S.scene.find((x) => x.id === el.dataset.scene)?.auto.parts;
        const light = ap?.light || LIGHT0;
        sun.intensity = light.k;
        hemi.intensity = 0.5 * light.k;
        scene.environmentIntensity = light.k;
        sun.color.copy(kelvin(light.temp));
        hemi.color.copy(kelvin(light.temp));
        const az = (light.az * Math.PI) / 180;
        sun.position.set(centre.x + 6 * Math.cos(az), centre.y + 6, centre.z + 6 * Math.sin(az));
        if (!parts) return;
        for (const [role, info] of Object.entries(parts.roles)) {
          const m = MATS.find((x) => x.id === ap?.v3d[role]?.[0]);
          for (const part of info.parts) {
            for (const o of at(part.path)) {
              if (!m) { o.material = o.userData.orig.material; continue; }
              if (!o.geometry.attributes.uv) boxUv(o.geometry);
              const uvM = part.uv_m ?? 1, tile = m.kind === 'mdl' ? 1 : m.tile_m ?? uvM;
              o.material = material(m, Math.round((100 * uvM) / tile) / 100);
            }
          }
        }
        const lift = parts.lift, dz = lift && ap?.vz != null ? ap.vz - parts.top_z : 0;
        for (const o of [...(lift?.move || []).flatMap(at), ...desk]) o.position.y = o.userData.orig.y + dz;
        for (const [rel, base, top] of lift?.stretch || []) {
          const s = (top - base + dz) / (top - base);
          for (const o of at(rel)) {
            o.scale.y = o.userData.orig.sy * s;

      };
      v.sync();
      const resize = () => {

      };

      observer.observe(el);

      renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

        renderer.setAnimationLoop(null);
        observer.disconnect();
        controls.dispose();
        scene.traverse((o) => {

    .catch((err) => {

}
function onKey(ev) {
  if ($('#lightbox').classList.contains('on')) {
    if (ev.key === 'Escape') closeLB();
    else if (ev.key === 'ArrowLeft') lbStep(-1);
    else if (ev.key === 'ArrowRight') lbStep(1);
    else return;
    ev.preventDefault();
    return;
  }
  if (!ME) return;
  if (ev.key === 'Escape' && UI.drawer) { closeDrawer(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[data-open][tabindex]')) { ev.preventDefault(); ev.target.click(); return; }
  if (UI.tab !== 'qa' || UI.drawer || ev.target.matches('input, textarea, select, video') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const list = qaList(), i = list.findIndex((e) => e.id === UI.ep), k = ev.key.toLowerCase();
  if (k === 'j' || k === 'arrowdown') pick(list[Math.min(i + 1, list.length - 1)]?.id);
  else if (k === 'k' || k === 'arrowup') pick(list[Math.max(i - 1, 0)]?.id);
  else if (UI.ep && k === 'p') setQA('pass');
  else if (UI.ep && k === 'r') setQA('reject');
  else if (UI.ep && k === 'u') setQA('pending');
  else return;
  ev.preventDefault();
}
function onClick(ev) {
  const lb = ev.target.closest('[data-lb]');
  if (lb) { lightbox(GAL[lb.dataset.lb], Number(lb.dataset.i)); return; }
  const g = ev.target.closest('[data-go]');
  if (g) { ev.preventDefault(); go(g.dataset.go, g.dataset.id); return; }
  const o = ev.target.closest('[data-open]');
  if (!o) return;
  const control = ev.target.closest('input, button, a, label, select, textarea, video');
  if (control && control !== o && o.contains(control)) return;  // controls inside a row or card act on their own
  if (o.dataset.open === 'episode') pick(o.dataset.id);
  else openDrawer(o.dataset.open, o.dataset.id, o);
}

// ---------- render ----------
const VIEWS = {overview: viewOverview, scenes: viewScenes, objects: viewObjects, robots: viewRobots, tasks: viewTasks, qa: viewQA, evals: viewEvals, prototypes: viewPrototypes, users: viewUsers};
function render() {
  EP_BY_TASK = group(live(S.episode), (e) => e.auto.task);
  renderNav();
  if (!UI.loaded) return;
  const focus = document.activeElement?.id, scroll = $('.qa-list')?.scrollTop, oldVideos = $('#qa-videos'), opening = UI.drawerFocus;
  $('#main').innerHTML = VIEWS[UI.tab]();
  const slot = $('#qa-videos');
  if (oldVideos && slot && oldVideos.dataset.ep === slot.dataset.ep) slot.replaceWith(oldVideos);  // keep playback position
  if (scroll && $('.qa-list')) $('.qa-list').scrollTop = scroll;
  renderDrawer();
  mountModel();
  const el = focus && document.getElementById(focus);
  if (el && el !== document.activeElement && !opening) {
    el.focus({preventScroll: true});
    if (el.type === 'text') el.setSelectionRange(el.value.length, el.value.length);
  }
}
const tabFromHash = () => (VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'overview');
window.addEventListener('hashchange', () => { UI.tab = tabFromHash(); stashDraft(); UI.drawer = null; render(); window.scrollTo(0, 0); });
document.addEventListener('change', onFieldChange);

UI.tab = tabFromHash();
renderNav();
fetch('/api/me').then((r) => (r.ok ? r.json() : null)).then((me) => {
  if (!me) return showLogin();
  ME = me;
  return enter();
}).catch((err) => toast(`加载失败：${err.message}`, true));
