# Unitree G1-D left arm + Dex1-1 gripper (G1DLeft). Copied to Assets/Robots/g1d/ by build_asset.py.
urdf_path: "./g1d_dex1.urdf"
ee_joints: "left_wrist_yaw_joint"
ee_link: "left_dex1_base_link"
ee_type: "gripper"
base_link: "torso_link"
arm_joints_name: ['left_shoulder_pitch_joint', 'left_shoulder_roll_joint', 'left_shoulder_yaw_joint', 'left_elbow_joint',
                  'left_wrist_roll_joint', 'left_wrist_pitch_joint', 'left_wrist_yaw_joint']
gripper_joints_name: ['left_dex1_finger_joint_1', 'left_dex1_finger_joint_2']
gripper_move:
    base: "left_dex1_finger_joint_1"
    sign: -1.0  # Dex1-1: positive q closes
    mimic: ["left_dex1_finger_joint_2", 1., 0.]
gripper_bias: 0.12              # dex1_base_link origin -> fingertip centre (m)
gripper_scale: [-0.02, 0.0245]  # finger travel: open .. closed
delta_matrix: [[1,0,0],[0,1,0],[0,0,1]]
grasp_camera_reference_axis: [1, 0, 0]
# Camera mounts are calibration knobs, fitted by eye to real G1-D head/wrist recordings.
# ori is a wxyz quaternion from the link frame (x forward, z up) to the USD camera (-z forward, +y up).
camera:
  -
    link: "d435_link"
    name: "cam_head"  # left eye of the head stereo pair, as in the real training recordings
    type: Gemini_345Lg  # wide-angle (~96 x 71 deg); the real G1-D head view shows the table, wall and chest
    mesh: pinhole
    # Stereo calibration: eyes at y = +-29.8 mm from the head centre, optical axes 47.6 deg down (= d435_link pitch).
    # d435_link sits 17.5 mm left of the centre, 20 mm behind the face; the eyes are moved 25 mm forward (horizontally;
    # (0.0169, 0, 0.0185) in the pitched d435_link frame) to just outside the head shell, so the shell stays visible.
    pos: [0.0169, 0.0123, 0.0185]
    ori: [0.5, 0.5, -0.5, -0.5]  # along d435_link x
  -
    link: "d435_link"
    name: "cam_head_right"  # right eye
    type: Gemini_345Lg
    mesh: pinhole
    pos: [0.0169, -0.0473, 0.0185]
    ori: [0.5, 0.5, -0.5, -0.5]
  -
    link: "left_dex1_base_link"
    name: "cam_wrist"
    type: d435
    mesh: pinhole
    pos: [0.055, 0, 0.095]  # fitted to the real wrist view: finger roots and slot visible, housing out of frame
    ori: [0.6485, 0.282, -0.282, -0.6485]  # looks along the fingers, 43 deg down
